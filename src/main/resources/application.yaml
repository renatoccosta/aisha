spring:
  application:
    name: aisha
  datasource:
    url: jdbc:hsqldb:mem:aisha
    username: sa
    password:
  sql:
    init:
      mode: embedded
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
  thymeleaf:
    cache: false
server:
  servlet:
    session:
      timeout: 45m
      cookie:
        http-only: true
        same-site: lax
        secure: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

aisha:
  security:
    seed:
      username: admin
      password: admin

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aisha}
    username: ${DB_USERNAME:aisha}
    password: ${DB_PASSWORD:aisha}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
spring:
  config:
    activate:
      on-profile: prod
server:
  servlet:
    session:
      cookie:
        secure: true
