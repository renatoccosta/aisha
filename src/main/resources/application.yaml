spring:
  config:
    import: optional:file:.env.properties[.properties]
  application:
    name: aisha
  output:
    ansi:
      enabled: always
  datasource:
    url: jdbc:hsqldb:mem:aisha
    username: sa
    password:
  sql:
    init:
      mode: embedded
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  thymeleaf:
    cache: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:change-me-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:change-me-google-client-secret}
            scope: openid,profile,email
server:
  servlet:
    session:
      timeout: 45m
      cookie:
        http-only: true
        same-site: lax
        secure: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
  pattern:
    correlation: "[%X{correlationId:-n/a}] "

aisha:
  debug:
    force-error-endpoint-enabled: true
  security:
    seed:
      username: admin
      password: admin

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aisha}
    username: ${DB_USERNAME:aisha}
    password: ${DB_PASSWORD:aisha}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
spring:
  config:
    activate:
      on-profile: prod
aisha:
  debug:
    force-error-endpoint-enabled: false
server:
  servlet:
    session:
      cookie:
        secure: true
