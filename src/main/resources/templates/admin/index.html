<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{admin.title}"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/aisha-logo-simple.svg}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<header th:replace="~{fragments/header :: topbar(subtitle=#{admin.header.subtitle})}"></header>

<main class="wrap">
    <section class="card form-card">
        <h2 th:text="#{admin.heading}"></h2>
        <p th:text="#{admin.subtitle}"></p>
    </section>

    <section class="admin-grid">
        <a class="card admin-nav-card" th:href="@{/local-users}">
            <div class="admin-nav-card-icon">
                <i data-lucide="users" aria-hidden="true"></i>
            </div>
            <div>
                <h3 th:text="#{admin.users.heading}"></h3>
                <p th:text="#{admin.users.subtitle}"></p>
            </div>
        </a>

        <a class="card admin-nav-card" th:href="@{/admin/models}">
            <div class="admin-nav-card-icon">
                <i data-lucide="brain-circuit" aria-hidden="true"></i>
            </div>
            <div>
                <h3 th:text="#{admin.models.heading}"></h3>
                <p th:text="#{admin.models.subtitle}"></p>
            </div>
        </a>

        <a class="card admin-nav-card" th:href="@{/admin/system-backup}">
            <div class="admin-nav-card-icon">
                <i data-lucide="archive" aria-hidden="true"></i>
            </div>
            <div>
                <h3 th:text="#{admin.backup.heading}"></h3>
                <p th:text="#{admin.backup.subtitle}"></p>
            </div>
        </a>
    </section>
</main>
<footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>
</html>
