<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${mode == 'create'} ? #{localUsers.form.title.create} : #{localUsers.form.title.edit}"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/aisha-logo-simple.svg}">
</head>
<body>
<header th:replace="~{fragments/header :: topbar(subtitle=#{localUsers.form.header.subtitle})}"></header>

<main class="wrap">
    <section class="card form-card">
        <h2 th:text="${mode == 'create'} ? #{localUsers.form.title.create} : #{localUsers.form.title.edit}"></h2>

        <form class="stack-form" th:object="${form}" th:action="${mode == 'create'} ? @{/local-users} : @{/local-users/{id}(id=${localUserId})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="returnTo" th:value="${returnTo}">
            <div class="field">
                <label for="username" th:text="#{localUsers.form.field.username.required}"></label>
                <input id="username" type="text" th:field="*{username}" maxlength="80" required>
                <p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label for="password" th:text="${mode == 'create'} ? #{localUsers.form.field.password.required} : #{localUsers.form.field.password.optional}"></label>
                    <input id="password" type="password" th:field="*{password}" maxlength="120" th:attr="required=${mode == 'create'}">
                    <p class="helper" th:if="${mode == 'edit'}" th:text="#{localUsers.form.field.password.help}"></p>
                    <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>

                <div class="field">
                    <label for="passwordConfirmation" th:text="#{localUsers.form.field.passwordConfirmation.required}"></label>
                    <input id="passwordConfirmation" type="password" th:field="*{passwordConfirmation}" maxlength="120" th:attr="required=${mode == 'create'}">
                    <p class="error" th:if="${#fields.hasErrors('passwordConfirmation')}" th:errors="*{passwordConfirmation}"></p>
                </div>
            </div>

            <div class="field field-checkbox">
                <label for="enabled" class="label-checkbox">
                    <input id="enabled" type="checkbox" th:field="*{enabled}">
                    <span th:text="#{localUsers.form.field.enabled}"></span>
                </label>
            </div>

            <p class="error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>

            <div class="actions-inline">
                <button class="btn btn-primary" type="submit">
                    <i data-lucide="save" aria-hidden="true"></i>
                    <span th:text="${mode == 'create'} ? #{localUsers.form.action.save} : #{localUsers.form.action.update}"></span>
                </button>
                <a class="btn btn-secondary" th:href="${returnTo}">
                    <i data-lucide="arrow-left" aria-hidden="true"></i>
                    <span th:text="#{localUsers.form.action.cancel}"></span>
                </a>
            </div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>
</html>
