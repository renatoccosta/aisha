<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{localUsers.list.title}"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/aisha-logo-simple.svg}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<header th:replace="~{fragments/header :: topbar(subtitle=#{localUsers.list.header.subtitle})}"></header>

<main class="wrap">
    <section class="card header-actions">
        <div>
            <h2 th:text="#{localUsers.list.heading}"></h2>
            <p th:text="#{localUsers.list.subtitle}"></p>
        </div>
        <a class="btn btn-primary" th:href="@{/local-users/new}">
            <i data-lucide="user-plus" aria-hidden="true"></i>
            <span th:text="#{localUsers.list.action.new}"></span>
        </a>
    </section>

    <section id="table-container" th:fragment="table" class="card">
        <p
            class="error"
            th:if="${hasError}"
            th:text="${errorKey != null ? #messages.msg(errorKey) : #messages.msg('localUsers.error.invalidOperation')}">
        </p>

        <div class="pagination-bar" th:if="${pagination != null}">
            <div class="pagination-controls">
                <form
                    class="pagination-size-form"
                    method="get"
                    th:action="@{/local-users}"
                    hx-get="/local-users/fragments/table"
                    hx-target="#table-container"
                    hx-swap="outerHTML">
                    <input type="hidden" name="page" value="0">
                    <label for="local-users-page-size" th:text="#{pagination.size.label}"></label>
                    <select id="local-users-page-size" name="size" onchange="this.form.requestSubmit()">
                        <option
                            th:each="allowedSize : ${allowedPageSizes}"
                            th:value="${allowedSize}"
                            th:selected="${allowedSize == pagination.pageSize}"
                            th:text="${allowedSize}">
                        </option>
                    </select>
                </form>

                <form
                    class="pagination-nav-form"
                    method="get"
                    th:action="@{/local-users}"
                    hx-get="/local-users/fragments/table"
                    hx-target="#table-container"
                    hx-swap="outerHTML">
                    <input type="hidden" name="size" th:value="${pagination.pageSize}">
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.firstPage()}" th:disabled="${!pagination.hasPrevious()}">
                        <i data-lucide="chevrons-left" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.first}"></span>
                    </button>
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.previousPage()}" th:disabled="${!pagination.hasPrevious()}">
                        <i data-lucide="chevron-left" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.previous}"></span>
                    </button>
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.nextPage()}" th:disabled="${!pagination.hasNext()}">
                        <i data-lucide="chevron-right" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.next}"></span>
                    </button>
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.lastPage()}" th:disabled="${!pagination.hasNext()}">
                        <i data-lucide="chevrons-right" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.last}"></span>
                    </button>
                </form>
            </div>
            <div class="pagination-summary">
                <span th:text="#{pagination.summary.page(${pagination.currentPageDisplay()}, ${pagination.totalPages})}"></span>
                <span th:text="#{pagination.summary.range(${pagination.rangeStart}, ${pagination.rangeEnd}, ${pagination.totalItems})}"></span>
            </div>
        </div>

        <form
            th:action="@{/local-users/bulk-delete}"
            method="post"
            hx-post="/local-users/bulk-delete"
            hx-target="#table-container"
            hx-swap="outerHTML"
            th:attr="hx-confirm=#{localUsers.list.confirm.bulkDelete}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="page" th:value="${pagination != null ? pagination.page : 0}">
            <input type="hidden" name="size" th:value="${pagination != null ? pagination.pageSize : 25}">

            <div class="table-actions">
                <button class="btn btn-danger" type="submit">
                    <i data-lucide="trash-2" aria-hidden="true"></i>
                    <span th:text="#{localUsers.list.action.bulkDelete}"></span>
                </button>
            </div>

            <div class="table-wrap">
                <table class="responsive-list">
                    <thead>
                    <tr>
                        <th>
                            <span class="table-heading-label" aria-hidden="true">
                                <i data-lucide="check-square" aria-hidden="true"></i>
                            </span>
                            <span class="sr-only" th:text="#{localUsers.list.table.select}"></span>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="user" aria-hidden="true"></i>
                                <span th:text="#{localUsers.list.table.username}"></span>
                            </span>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="shield-check" aria-hidden="true"></i>
                                <span th:text="#{localUsers.list.table.status}"></span>
                            </span>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="settings" aria-hidden="true"></i>
                                <span th:text="#{localUsers.list.table.actions}"></span>
                            </span>
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(localUsers)}" class="empty-row">
                        <td colspan="4" class="empty" th:text="#{localUsers.list.empty}"></td>
                    </tr>
                    <tr th:each="localUser : ${localUsers}">
                        <td class="cell-select" th:attr="data-label=#{localUsers.list.table.select}">
                            <input
                                type="checkbox"
                                name="ids"
                                th:value="${localUser.id}"
                                th:disabled="${currentUsername != null && #strings.toLowerCase(localUser.username) == #strings.toLowerCase(currentUsername)}"
                                th:attr="aria-label=#{localUsers.list.table.selectItem}">
                        </td>
                        <td th:attr="data-label=#{localUsers.list.table.username}" th:text="${localUser.username}"></td>
                        <td th:attr="data-label=#{localUsers.list.table.status}">
                            <span th:text="${localUser.enabled ? #messages.msg('localUsers.list.status.enabled') : #messages.msg('localUsers.list.status.disabled')}"></span>
                        </td>
                        <td class="cell-actions" th:attr="data-label=#{localUsers.list.table.actions}">
                            <div class="actions-inline">
                                <a class="btn btn-secondary" th:href="@{/local-users/{id}/edit(id=${localUser.id})}">
                                    <i data-lucide="edit-3" aria-hidden="true"></i>
                                    <span th:text="#{localUsers.list.action.edit}"></span>
                                </a>
                                <button
                                    class="btn btn-danger"
                                    type="button"
                                    th:disabled="${currentUsername != null && #strings.toLowerCase(localUser.username) == #strings.toLowerCase(currentUsername)}"
                                    th:attr="hx-post=@{/local-users/{id}/delete(id=${localUser.id},page=${pagination != null ? pagination.page : 0},size=${pagination != null ? pagination.pageSize : 25})},hx-confirm=#{localUsers.list.confirm.delete}"
                                    hx-target="#table-container"
                                    hx-swap="outerHTML">
                                    <i data-lucide="trash-2" aria-hidden="true"></i>
                                    <span th:text="#{localUsers.list.action.delete}"></span>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </form>

    </section>
</main>
<footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>
</html>
