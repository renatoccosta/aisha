<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{entries.list.title}"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/aisha-logo-simple.svg}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<header th:replace="~{fragments/header :: topbar(subtitle=#{entries.list.header.subtitle})}"></header>

<main class="wrap">
    <section class="card header-actions">
        <div>
            <h2 th:text="#{entries.list.heading}"></h2>
            <p th:text="#{entries.list.subtitle}"></p>
        </div>
        <div class="actions-inline">
            <a class="btn btn-secondary" th:href="@{/entries/import}">
                <i data-lucide="file-up" aria-hidden="true"></i>
                <span th:text="#{entries.list.action.batchCreate}"></span>
            </a>
            <a class="btn btn-secondary" th:href="@{/entries/statement-import}">
                <i data-lucide="file-input" aria-hidden="true"></i>
                <span th:text="#{entries.list.action.importStatement}"></span>
            </a>
            <a class="btn btn-primary" th:href="@{/entries/new}">
                <i data-lucide="plus" aria-hidden="true"></i>
                <span th:text="#{entries.list.action.new}"></span>
            </a>
        </div>
    </section>

    <section id="table-container" th:fragment="table" class="card">
        <form
            class="list-filters"
            method="get"
            th:action="@{/entries}"
            hx-get="/entries/fragments/table"
            hx-target="#table-container"
            hx-swap="outerHTML"
            hx-trigger="change from:#filter-account, change from:#filter-category">
            <div class="grid-2">
                <div class="field">
                    <label for="filter-account" th:text="#{entries.list.filter.account}"></label>
                    <select id="filter-account" name="accountId">
                        <option value="" th:text="#{entries.list.filter.allAccounts}"></option>
                        <option
                            th:each="account : ${accountOptions}"
                            th:value="${account.id}"
                            th:selected="${selectedAccountId != null and selectedAccountId == account.id}"
                            th:text="${account.title}">
                        </option>
                    </select>
                </div>
                <div class="field">
                    <label for="filter-category" th:text="#{entries.list.filter.category}"></label>
                    <select id="filter-category" name="categoryId">
                        <option value="" th:text="#{entries.list.filter.allCategories}"></option>
                        <option value="-1" th:selected="${selectedCategoryId != null and selectedCategoryId == -1}"
                                th:text="#{entries.list.filter.withoutCategory}"></option>
                        <option
                            th:each="category : ${categoryOptions}"
                            th:value="${category.id}"
                            th:selected="${selectedCategoryId != null and selectedCategoryId == category.id}"
                            th:text="${category.label}">
                        </option>
                    </select>
                </div>
            </div>
            <input type="hidden" name="page" value="0">
            <input type="hidden" name="size" th:value="${pagination != null ? pagination.pageSize : 25}">
        </form>

        <div class="pagination-bar" th:if="${pagination != null}">
            <div class="pagination-controls">
                <form
                    class="pagination-size-form"
                    method="get"
                    th:action="@{/entries}"
                    hx-get="/entries/fragments/table"
                    hx-target="#table-container"
                    hx-swap="outerHTML">
                    <input type="hidden" name="accountId" th:value="${selectedAccountId}">
                    <input type="hidden" name="categoryId" th:value="${selectedCategoryId}">
                    <input type="hidden" name="page" value="0">
                    <label for="entries-page-size" th:text="#{pagination.size.label}"></label>
                    <select id="entries-page-size" name="size">
                        <option
                            th:each="allowedSize : ${allowedPageSizes}"
                            th:value="${allowedSize}"
                            th:selected="${allowedSize == pagination.pageSize}"
                            th:text="${allowedSize}">
                        </option>
                    </select>
                    <button class="btn btn-secondary" type="submit">
                        <i data-lucide="check" aria-hidden="true"></i>
                        <span th:text="#{pagination.size.apply}"></span>
                    </button>
                </form>

                <form
                    class="pagination-nav-form"
                    method="get"
                    th:action="@{/entries}"
                    hx-get="/entries/fragments/table"
                    hx-target="#table-container"
                    hx-swap="outerHTML">
                    <input type="hidden" name="accountId" th:value="${selectedAccountId}">
                    <input type="hidden" name="categoryId" th:value="${selectedCategoryId}">
                    <input type="hidden" name="size" th:value="${pagination.pageSize}">
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.firstPage()}" th:disabled="${!pagination.hasPrevious()}">
                        <i data-lucide="chevrons-left" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.first}"></span>
                    </button>
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.previousPage()}" th:disabled="${!pagination.hasPrevious()}">
                        <i data-lucide="chevron-left" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.previous}"></span>
                    </button>
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.nextPage()}" th:disabled="${!pagination.hasNext()}">
                        <i data-lucide="chevron-right" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.next}"></span>
                    </button>
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.lastPage()}" th:disabled="${!pagination.hasNext()}">
                        <i data-lucide="chevrons-right" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.last}"></span>
                    </button>
                </form>
            </div>
            <div class="pagination-summary">
                <span th:text="#{pagination.summary.page(${pagination.currentPageDisplay()}, ${pagination.totalPages})}"></span>
                <span th:text="#{pagination.summary.range(${pagination.rangeStart}, ${pagination.rangeEnd}, ${pagination.totalItems})}"></span>
            </div>
        </div>

        <form
            th:action="@{/entries/bulk-delete}"
            method="post"
            hx-post="/entries/bulk-delete"
            hx-target="#table-container"
            hx-swap="outerHTML"
            th:attr="hx-confirm=#{entries.list.confirm.bulkDelete}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="accountId" th:value="${selectedAccountId}">
            <input type="hidden" name="categoryId" th:value="${selectedCategoryId}">
            <input type="hidden" name="page" th:value="${pagination != null ? pagination.page : 0}">
            <input type="hidden" name="size" th:value="${pagination != null ? pagination.pageSize : 25}">

            <div class="table-actions">
                <button class="btn btn-danger" type="submit">
                    <i data-lucide="trash-2" aria-hidden="true"></i>
                    <span th:text="#{entries.list.action.bulkDelete}"></span>
                </button>
            </div>

            <div class="table-wrap">
                <table class="responsive-list">
                    <thead>
                    <tr>
                        <th>
                            <span class="table-heading-label" aria-hidden="true">
                                <i data-lucide="check-square" aria-hidden="true"></i>
                            </span>
                            <span class="sr-only" th:text="#{entries.list.table.select}"></span>
                        </th>
                        <th><span class="table-heading-label"><i data-lucide="briefcase" aria-hidden="true"></i><span th:text="#{entries.list.table.account}"></span></span></th>
                        <th><span class="table-heading-label"><i data-lucide="calendar" aria-hidden="true"></i><span th:text="#{entries.list.table.movementDate}"></span></span></th>
                        <th><span class="table-heading-label"><i data-lucide="calendar" aria-hidden="true"></i><span th:text="#{entries.list.table.settlementDate}"></span></span></th>
                        <th><span class="table-heading-label"><i data-lucide="file-text" aria-hidden="true"></i><span th:text="#{entries.list.table.description}"></span></span></th>
                        <th><span class="table-heading-label"><i data-lucide="tag" aria-hidden="true"></i><span th:text="#{entries.list.table.category}"></span></span></th>
                        <th><span class="table-heading-label"><i data-lucide="dollar-sign" aria-hidden="true"></i><span th:text="#{entries.list.table.amount}"></span></span></th>
                        <th><span class="table-heading-label"><i data-lucide="settings" aria-hidden="true"></i><span th:text="#{entries.list.table.actions}"></span></span></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(entries)}" class="empty-row">
                        <td colspan="8" class="empty" th:text="#{entries.list.empty}"></td>
                    </tr>
                    <tr th:each="entry : ${entries}">
                        <td class="cell-select" th:attr="data-label=#{entries.list.table.select}">
                            <input type="checkbox" name="ids" th:value="${entry.id}" th:attr="aria-label=#{entries.list.table.selectItem}">
                        </td>
                        <td th:attr="data-label=#{entries.list.table.account}" th:text="${entry.account.title}"></td>
                        <td th:attr="data-label=#{entries.list.table.movementDate}" th:text="${#temporals.format(entry.movementDate, 'dd/MM/yyyy')}"></td>
                        <td th:attr="data-label=#{entries.list.table.settlementDate}" th:text="${#temporals.format(entry.settlementDate, 'dd/MM/yyyy')}"></td>
                        <td th:attr="data-label=#{entries.list.table.description}" th:text="${entry.description}"></td>
                        <td th:attr="data-label=#{entries.list.table.category}"
                            th:text="${entry.category != null ? entry.category.title : #messages.msg('entries.list.table.category.empty')}"></td>
                        <td class="amount-cell" th:attr="data-label=#{entries.list.table.amount}" th:text="${#numbers.formatDecimal(entry.amount, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td class="cell-actions" th:attr="data-label=#{entries.list.table.actions}">
                            <div class="actions-inline entry-actions-inline">
                                <a class="btn btn-secondary" th:href="@{/entries/{id}/edit(id=${entry.id})}">
                                    <i data-lucide="edit-3" aria-hidden="true"></i>
                                    <span th:text="#{entries.list.action.edit}"></span>
                                </a>
                                <button
                                    class="btn btn-danger"
                                    type="button"
                                    th:attr="hx-post=@{/entries/{id}/delete(id=${entry.id},accountId=${selectedAccountId},categoryId=${selectedCategoryId},page=${pagination != null ? pagination.page : 0},size=${pagination != null ? pagination.pageSize : 25})},hx-confirm=#{entries.list.confirm.delete}"
                                    hx-target="#table-container"
                                    hx-swap="outerHTML">
                                    <i data-lucide="trash-2" aria-hidden="true"></i>
                                    <span th:text="#{entries.list.action.delete}"></span>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </form>
    </section>
</main>
</body>
</html>
