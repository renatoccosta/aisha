<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${mode == 'create'} ? #{entries.form.title.create} : #{entries.form.title.edit}"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/aisha-logo-simple.svg}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<header th:replace="~{fragments/header :: topbar(subtitle=#{entries.form.header.subtitle})}"></header>

<main class="wrap">
    <section class="card form-card">
        <h2 th:text="${mode == 'create'} ? #{entries.form.title.create} : #{entries.form.title.edit}"></h2>

        <p class="helper" th:if="${mode == 'edit' and entrySource != null and entryRegistrationDate != null}">
            <span th:if="${entrySource.name() == 'MANUAL'}" th:text="#{entries.form.registrationInfo.manual(${#temporals.format(entryRegistrationDate, 'dd/MM/yyyy')})}"></span>
            <span th:if="${entrySource.name() == 'IMPORT'}" th:text="#{entries.form.registrationInfo.import(${#temporals.format(entryRegistrationDate, 'dd/MM/yyyy')})}"></span>
        </p>

        <div class="helper" th:if="${form.transferEntry}">
            <strong th:text="#{entries.form.transfer.badge}"></strong>
            <span
                th:if="${transferView != null and transferView.originSide()}"
                th:text="#{entries.form.transfer.destination(${transferView.counterpartAccountTitle})}"></span>
            <span
                th:if="${transferView != null and !transferView.originSide()}"
                th:text="#{entries.form.transfer.origin(${transferView.counterpartAccountTitle})}"></span>
        </div>

        <form class="stack-form" th:object="${form}" th:action="${mode == 'create'} ? @{/entries} : @{/entries/{id}(id=${entryId})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="returnTo" th:value="${returnTo}">
            <input type="hidden" th:field="*{transferEntry}">
            <div class="grid-2">
                <div class="field">
                    <label for="account" th:text="#{entries.form.field.account.required}"></label>
                    <select
                        id="account"
                        th:field="*{accountId}"
                        th:disabled="${form.transferEntry}"
                        required
                        hx-get="/entries/fragments/category-suggestion"
                        hx-include="closest form"
                        hx-target="#category-selection-container"
                        hx-swap="outerHTML"
                        hx-trigger="change">
                        <option value="" th:text="#{entries.form.field.account.placeholder}"></option>
                        <option
                            th:each="account : ${accountOptions}"
                            th:value="${account.id}"
                            th:text="${account.title}">
                        </option>
                    </select>
                    <p class="error" th:if="${#fields.hasErrors('accountId')}" th:errors="*{accountId}"></p>
                </div>

                <div
                    id="category-selection-container"
                    class="field-group"
                    th:fragment="categorySelectionSection"
                    th:object="${form}"
                    th:if="${!form.transferEntry}">
                    <input type="hidden" th:field="*{suggestedCategoryId}">
                    <input type="hidden" th:field="*{suggestedCategoryConfidence}">
                    <div class="field">
                        <label for="categoryId" th:text="#{entries.form.field.category.required}"></label>
                        <select
                            id="categoryId"
                            th:field="*{categoryId}"
                            hx-get="/entries/fragments/category-suggestion"
                            hx-include="closest form"
                            hx-target="#category-selection-container"
                            hx-swap="outerHTML"
                            hx-trigger="change">
                            <option value="" th:text="#{entries.form.field.category.placeholder}"></option>
                            <option value="-2" th:text="#{entries.form.field.category.newOption}"></option>
                            <option
                                th:each="option : ${categoryOptions}"
                                th:value="${option.id()}"
                                th:text="${option.label()}">
                            </option>
                        </select>
                        <p class="error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></p>
                        <p class="helper suggestion-helper" th:if="${suggestedCategory != null}">
                            <span th:text="#{entries.form.field.category.suggestion(${suggestedCategory.title}, ${#numbers.formatDecimal(form.suggestedCategoryConfidence * 100, 1, 'POINT', 0, 'COMMA')})}"></span>
                        </p>
                        <p class="helper suggestion-helper" th:if="${suggestedCategory != null and pendingCategorySuggestion}">
                            <span th:text="#{entries.form.field.category.pendingValidation}"></span>
                        </p>
                    </div>

                    <div class="field" th:if="${showNewCategoryField}">
                        <label for="newCategoryTitle" th:text="#{entries.form.field.newCategoryTitle.required}"></label>
                        <input
                            id="newCategoryTitle"
                            type="text"
                            th:field="*{newCategoryTitle}"
                            maxlength="120"
                            th:placeholder="#{entries.form.field.newCategoryTitle.placeholder}">
                        <p class="error" th:if="${#fields.hasErrors('newCategoryTitle')}" th:errors="*{newCategoryTitle}"></p>
                    </div>
                </div>
            </div>

            <div class="field" th:if="${form.transferEntry}">
                <label th:text="#{entries.form.field.category}"></label>
                <p class="helper" th:text="#{entries.form.transfer.noCategory}"></p>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label for="movementDate" th:text="#{entries.form.field.movementDate.required}"></label>
                    <input id="movementDate" type="date" th:field="*{movementDate}" th:disabled="${form.transferEntry}" required>
                    <p class="error" th:if="${#fields.hasErrors('movementDate')}" th:errors="*{movementDate}"></p>
                </div>

                <div class="field">
                    <label for="settlementDate" th:text="#{entries.form.field.settlementDate.required}"></label>
                    <input id="settlementDate" type="date" th:field="*{settlementDate}" th:disabled="${form.transferEntry}" required>
                    <p class="error" th:if="${#fields.hasErrors('settlementDate')}" th:errors="*{settlementDate}"></p>
                </div>
            </div>

            <div class="field">
                <label for="description" th:text="#{entries.form.field.description.required}"></label>
                <input
                    id="description"
                    type="text"
                    th:field="*{description}"
                    th:readonly="${form.transferEntry}"
                    maxlength="200"
                    required
                        hx-get="/entries/fragments/category-suggestion"
                        hx-include="closest form"
                        hx-target="#category-selection-container"
                        hx-swap="outerHTML"
                        hx-trigger="changed delay:400ms, blur">
                <p class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
            </div>

            <div class="field">
                <label for="amount" th:text="#{entries.form.field.amount.required}"></label>
                <input
                    id="amount"
                    type="number"
                    th:field="*{amount}"
                    th:readonly="${form.transferEntry}"
                    step="0.01"
                    required
                    hx-get="/entries/fragments/category-suggestion"
                    hx-include="closest form"
                    hx-target="#category-selection-container"
                    hx-swap="outerHTML"
                    hx-trigger="change, blur">
                <p class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></p>
            </div>

            <div class="field">
                <label for="notes" th:text="#{entries.form.field.notes}"></label>
                <textarea id="notes" th:field="*{notes}" th:readonly="${form.transferEntry}" rows="4" maxlength="1000"></textarea>
                <p class="error" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></p>
            </div>

            <div class="actions-inline">
                <button class="btn btn-primary" th:if="${!(mode == 'edit' and form.transferEntry)}" type="submit">
                    <i data-lucide="save" aria-hidden="true"></i>
                    <span th:text="${mode == 'create'} ? #{entries.form.action.save} : #{entries.form.action.update}"></span>
                </button>
                <a
                    class="btn btn-secondary"
                    th:if="${mode == 'edit' and !form.transferEntry}"
                    th:href="@{/entries/{id}/transfer-counterpart(id=${entryId},returnTo=${returnTo})}">
                    <i data-lucide="repeat" aria-hidden="true"></i>
                    <span th:text="#{entries.form.action.createCounterpart}"></span>
                </a>
                <a class="btn btn-secondary" th:href="${returnTo}">
                    <i data-lucide="arrow-left" aria-hidden="true"></i>
                    <span th:text="#{entries.form.action.cancel}"></span>
                </a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>
</html>
