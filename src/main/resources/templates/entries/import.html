<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{entries.import.title}"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/aisha-logo-simple.svg}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<header th:replace="~{fragments/header :: topbar(subtitle=#{entries.import.header.subtitle})}"></header>

<main class="wrap">
    <section class="card form-card">
        <h2 th:text="#{entries.import.heading}"></h2>
        <p th:text="#{entries.import.subtitle}"></p>

        <form
            class="import-form"
            method="post"
            enctype="multipart/form-data"
            th:action="@{/entries/import/jobs}"
            hx-post="/entries/import/jobs"
            hx-target="#import-result"
            hx-swap="outerHTML">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="field">
                <label for="csv-file" th:text="#{entries.import.form.file.required}"></label>
                <input id="csv-file" type="file" name="file" accept=".csv,text/csv" required>
                <p class="helper" th:text="#{entries.import.form.file.help}"></p>
            </div>

            <div class="field">
                <label for="header-option" th:text="#{entries.import.form.header.required}"></label>
                <select id="header-option" name="headerOption">
                    <option value="WITH_HEADER" th:text="#{entries.import.form.header.option.withHeader}"></option>
                    <option value="WITHOUT_HEADER" th:text="#{entries.import.form.header.option.withoutHeader}"></option>
                </select>
                <p class="helper" th:text="#{entries.import.form.header.help}"></p>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label for="separator-option" th:text="#{entries.import.form.separator.required}"></label>
                    <select id="separator-option" name="separatorOption">
                        <option value="COMMA" th:text="#{entries.import.form.separator.option.comma}"></option>
                        <option value="SEMICOLON" th:text="#{entries.import.form.separator.option.semicolon}"></option>
                        <option value="PIPE" th:text="#{entries.import.form.separator.option.pipe}"></option>
                        <option value="TAB" th:text="#{entries.import.form.separator.option.tab}"></option>
                        <option value="OTHER" th:text="#{entries.import.form.separator.option.other}"></option>
                    </select>
                    <input
                        id="separator-other"
                        type="text"
                        name="separatorOther"
                        maxlength="4"
                        th:placeholder="#{entries.import.form.separator.other.placeholder}">
                    <p class="helper" th:text="#{entries.import.form.separator.help}"></p>
                </div>

                <div class="field">
                    <label for="date-format-option" th:text="#{entries.import.form.dateFormat.required}"></label>
                    <select id="date-format-option" name="dateFormatOption">
                        <option value="ISO" th:text="#{entries.import.form.dateFormat.option.iso}"></option>
                        <option value="BR" th:text="#{entries.import.form.dateFormat.option.br}"></option>
                        <option value="US" th:text="#{entries.import.form.dateFormat.option.us}"></option>
                        <option value="DMY_DASH" th:text="#{entries.import.form.dateFormat.option.dmyDash}"></option>
                        <option value="OTHER" th:text="#{entries.import.form.dateFormat.option.other}"></option>
                    </select>
                    <input
                        id="date-format-other"
                        type="text"
                        name="dateFormatOther"
                        maxlength="60"
                        th:placeholder="#{entries.import.form.dateFormat.other.placeholder}">
                    <p class="helper" th:text="#{entries.import.form.dateFormat.help}"></p>
                    <p class="helper">
                        <a href="https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/time/format/DateTimeFormatter.html#patterns"
                           target="_blank"
                           rel="noopener"
                           th:text="#{entries.import.form.dateFormat.docLink}">
                        </a>
                    </p>
                </div>
            </div>

            <div class="field">
                <label for="amount-format-option" th:text="#{entries.import.form.amountFormat.required}"></label>
                <select id="amount-format-option" name="amountFormatOption">
                    <option value="PT_BR" th:text="#{entries.import.form.amountFormat.option.ptBr}"></option>
                    <option value="US" th:text="#{entries.import.form.amountFormat.option.us}"></option>
                    <option value="OTHER" th:text="#{entries.import.form.amountFormat.option.other}"></option>
                </select>
                <input
                    id="amount-format-other"
                    type="text"
                    name="amountFormatOther"
                    maxlength="120"
                    th:placeholder="#{entries.import.form.amountFormat.other.placeholder}">
                <p class="helper" th:text="#{entries.import.form.amountFormat.help}"></p>
                <p class="helper">
                    <a href="https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/regex/Pattern.html"
                       target="_blank"
                       rel="noopener"
                       th:text="#{entries.import.form.amountFormat.docLink}">
                    </a>
                </p>
            </div>

            <div class="actions-inline">
                <button class="btn btn-primary" type="submit">
                    <i data-lucide="upload" aria-hidden="true"></i>
                    <span th:text="#{entries.import.form.action.start}"></span>
                </button>
                <a class="btn btn-secondary" th:href="@{/entries}">
                    <i data-lucide="arrow-left" aria-hidden="true"></i>
                    <span th:text="#{entries.import.form.action.back}"></span>
                </a>
            </div>
        </form>
    </section>

    <section
        id="category-model-status"
        th:fragment="categoryModelStatus"
        class="card import-result-card"
        hx-get="/entries/fragments/category-model-status"
        hx-trigger="load, every 4s"
        hx-target="#category-model-status"
        hx-swap="outerHTML">
        <div class="section-heading">
            <div>
                <h3 th:text="#{entries.import.model.title}"></h3>
                <p th:text="#{entries.import.model.subtitle}"></p>
            </div>
            <form
                method="post"
                th:action="@{/entries/category-model/retrain}"
                hx-post="/entries/category-model/retrain"
                hx-target="#category-model-status"
                hx-swap="outerHTML">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-secondary" type="submit">
                    <i data-lucide="brain-circuit" aria-hidden="true"></i>
                    <span th:text="#{entries.import.model.action.retrain}"></span>
                </button>
            </form>
        </div>

        <p class="helper" th:if="${manualTrainingRequested}" th:text="#{entries.import.model.manualRequested}"></p>

        <div class="cell-stack">
            <span class="status-chip" th:if="${categoryModelStatus.trainingInProgress}" th:text="#{entries.import.model.status.training}"></span>
            <span class="status-chip" th:if="${!categoryModelStatus.trainingInProgress and categoryModelStatus.modelAvailable}" th:text="#{entries.import.model.status.ready}"></span>
            <span class="status-chip" th:if="${!categoryModelStatus.trainingInProgress and !categoryModelStatus.modelAvailable}" th:text="#{entries.import.model.status.unavailable}"></span>
            <span class="status-chip" th:if="${categoryModelStatus.retrainQueued}" th:text="#{entries.import.model.status.queued}"></span>
        </div>

        <dl class="import-summary-grid">
            <div>
                <dt th:text="#{entries.import.model.summary.version}"></dt>
                <dd th:text="${categoryModelStatus.version != null ? categoryModelStatus.version : '-'}"></dd>
            </div>
            <div>
                <dt th:text="#{entries.import.model.summary.modelName}"></dt>
                <dd th:text="${categoryModelStatus.modelName != null ? categoryModelStatus.modelName : '-'}"></dd>
            </div>
            <div>
                <dt th:text="#{entries.import.model.summary.pipeline}"></dt>
                <dd th:text="${categoryModelStatus.pipelineVersion != null ? categoryModelStatus.pipelineVersion : '-'}"></dd>
            </div>
            <div>
                <dt th:text="#{entries.import.model.summary.examples}"></dt>
                <dd th:text="${categoryModelStatus.trainingExampleCount != null ? categoryModelStatus.trainingExampleCount : '-'}"></dd>
            </div>
            <div>
                <dt th:text="#{entries.import.model.summary.labels}"></dt>
                <dd th:text="${categoryModelStatus.labelCount != null ? categoryModelStatus.labelCount : '-'}"></dd>
            </div>
            <div>
                <dt th:text="#{entries.import.model.summary.vocabulary}"></dt>
                <dd th:text="${categoryModelStatus.vocabularySize != null ? categoryModelStatus.vocabularySize : '-'}"></dd>
            </div>
            <div>
                <dt th:text="#{entries.import.model.summary.trigger}"></dt>
                <dd th:text="${categoryModelStatus.trigger != null ? #messages.msg('entries.import.model.trigger.' + #strings.toLowerCase(categoryModelStatus.trigger)) : '-'}"></dd>
            </div>
            <div>
                <dt th:text="#{entries.import.model.summary.completedAt}"></dt>
                <dd th:text="${categoryModelStatus.completedAt != null ? #temporals.format(categoryModelStatus.completedAt, 'dd/MM/yyyy HH:mm:ss') : '-'}"></dd>
            </div>
        </dl>

        <p class="helper"
           th:if="${categoryModelStatus.failureMessage != null and !#strings.isEmpty(categoryModelStatus.failureMessage)}"
           th:text="#{entries.import.model.failure(${categoryModelStatus.failureMessage})}"></p>
    </section>

    <section id="import-result" th:fragment="result" class="card import-result-card" th:classappend="${mode == 'processing'} ? ' loading' : ''"
        th:attr="hx-get=${mode == 'processing'} ? @{/entries/import/jobs/{jobId}(jobId=${jobId})} : null, hx-trigger=${mode == 'processing'} ? 'every 1s' : null, hx-target=${mode == 'processing'} ? '#import-result' : null, hx-swap=${mode == 'processing'} ? 'outerHTML' : null">

        <div th:if="${mode == 'idle'}">
            <h3 th:text="#{entries.import.result.idle.title}"></h3>
            <p th:text="#{entries.import.result.idle.text}"></p>
        </div>

        <div th:if="${mode == 'processing'}">
            <h3 th:text="#{entries.import.result.processing.title}"></h3>
            <p th:text="#{entries.import.result.processing.text}"></p>
            <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" th:attr="aria-valuenow=${progressPercent}">
                <div class="progress-fill" th:style="|width: ${progressPercent}%;|"></div>
            </div>
            <p class="helper" th:text="#{entries.import.result.processing.count(${processedRows}, ${totalRows})}"></p>
        </div>

        <div th:if="${mode == 'success'}">
            <h3 th:text="#{entries.import.result.success.title}"></h3>
            <p th:text="#{entries.import.result.success.text}"></p>

            <dl class="import-summary-grid">
                <div>
                    <dt th:text="#{entries.import.result.summary.imported}"></dt>
                    <dd th:text="${summary.importedCount}"></dd>
                </div>
                <div>
                    <dt th:text="#{entries.import.result.summary.skipped}"></dt>
                    <dd th:text="${summary.skippedDuplicateCount}"></dd>
                </div>
                <div>
                    <dt th:text="#{entries.import.result.summary.createdAccounts}"></dt>
                    <dd th:text="${summary.createdAccountsCount}"></dd>
                </div>
                <div>
                    <dt th:text="#{entries.import.result.summary.createdCategories}"></dt>
                    <dd th:text="${summary.createdCategoriesCount}"></dd>
                </div>
                <div>
                    <dt th:text="#{entries.import.result.summary.duration}"></dt>
                    <dd th:text="#{entries.import.result.summary.durationValue(${summary.durationMillis})}"></dd>
                </div>
            </dl>
        </div>

        <div th:if="${mode == 'failed'}">
            <h3 th:text="#{entries.import.result.failure.title}"></h3>
            <p class="error" th:text="#{${failureCauseKey}}"></p>
            <p class="helper" th:if="${failedRow != null}" th:text="#{entries.import.result.failure.row(${failedRow})}"></p>
            <p class="helper" th:if="${failedColumnKey != null}">
                <span th:text="#{entries.import.result.failure.columnPrefix}"></span>
                <strong th:text="#{${failedColumnKey}}"></strong>
            </p>
            <p class="helper" th:if="${failureDetailMessage != null and !#strings.isEmpty(failureDetailMessage)}"
               th:text="#{entries.import.result.failure.message(${failureDetailMessage})}"></p>
            <p class="helper" th:text="#{entries.import.result.failure.rollback}"></p>
        </div>
    </section>
</main>
</body>
</html>
