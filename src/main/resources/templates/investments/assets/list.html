<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{investments.assets.list.title}"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/aisha-logo-simple.svg}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<header th:replace="~{fragments/header :: topbar(subtitle=#{investments.assets.list.header.subtitle})}"></header>

<main class="wrap">
    <section class="card header-actions">
        <div>
            <h2 th:text="#{investments.assets.list.heading}"></h2>
            <p th:text="#{investments.assets.list.subtitle}"></p>
        </div>
        <div class="actions-inline">
            <a class="btn btn-secondary" th:href="@{/investments/operations}">
                <i data-lucide="repeat-2" aria-hidden="true"></i>
                <span th:text="#{investments.assets.list.action.operations}"></span>
            </a>
            <a class="btn btn-primary" th:href="@{/investments/assets/new(returnTo=${returnTo})}">
                <i data-lucide="plus" aria-hidden="true"></i>
                <span th:text="#{investments.assets.list.action.new}"></span>
            </a>
        </div>
    </section>

    <section id="table-container" th:fragment="table" class="card">
        <p class="error" th:if="${hasError}" th:text="#{investments.assets.error.inUse}"></p>

        <section class="filter-panel">
            <div class="filter-panel-header">
                <h3 th:text="#{investments.assets.list.filters.heading}"></h3>
                <p th:text="#{investments.assets.list.filters.subtitle}"></p>
            </div>

            <form
                class="list-filters"
                method="get"
                th:action="@{/investments/assets}"
                hx-get="/investments/assets/fragments/table"
                hx-target="#table-container"
                hx-swap="outerHTML"
                hx-push-url="true"
                hx-trigger="input changed delay:400ms from:#filter-description, search from:#filter-description, change from:#filter-account, change from:#filter-type">
                <div class="grid-2">
                    <div class="field">
                        <label for="filter-account" th:text="#{investments.assets.list.filter.account}"></label>
                        <select id="filter-account" name="accountId">
                            <option value="" th:text="#{investments.assets.list.filter.allAccounts}"></option>
                            <option
                                th:each="account : ${accountOptions}"
                                th:value="${account.id}"
                                th:selected="${selectedAccountId != null and selectedAccountId == account.id}"
                                th:text="${account.title}">
                            </option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="filter-type" th:text="#{investments.assets.list.filter.type}"></label>
                        <select id="filter-type" name="type">
                            <option value="" th:text="#{investments.assets.list.filter.allTypes}"></option>
                            <option
                                th:each="assetType : ${assetTypes}"
                                th:value="${assetType}"
                                th:selected="${selectedAssetType != null and selectedAssetType == assetType}"
                                th:text="#{${'asset.type.' + assetType.name().toLowerCase()}}">
                            </option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="filter-description" th:text="#{investments.assets.list.filter.description}"></label>
                        <input
                            id="filter-description"
                            name="description"
                            type="search"
                            th:value="${selectedDescription}"
                            th:placeholder="#{investments.assets.list.filter.description.placeholder}">
                    </div>
                </div>
                <input type="hidden" name="page" value="0">
                <input type="hidden" name="size" th:value="${pagination != null ? pagination.pageSize : 25}">
            </form>
        </section>

        <div class="pagination-bar" th:if="${pagination != null}">
            <div class="pagination-controls">
                <form
                    class="pagination-size-form"
                    method="get"
                    th:action="@{/investments/assets}"
                    hx-get="/investments/assets/fragments/table"
                    hx-target="#table-container"
                    hx-swap="outerHTML">
                    <input type="hidden" name="accountId" th:value="${selectedAccountId}">
                    <input type="hidden" name="type" th:value="${selectedAssetType}">
                    <input type="hidden" name="description" th:value="${selectedDescription}">
                    <input type="hidden" name="page" value="0">
                    <label for="assets-page-size" th:text="#{pagination.size.label}"></label>
                    <select id="assets-page-size" name="size" onchange="this.form.requestSubmit()">
                        <option
                            th:each="allowedSize : ${allowedPageSizes}"
                            th:value="${allowedSize}"
                            th:selected="${allowedSize == pagination.pageSize}"
                            th:text="${allowedSize}">
                        </option>
                    </select>
                </form>

                <form
                    class="pagination-nav-form"
                    method="get"
                    th:action="@{/investments/assets}"
                    hx-get="/investments/assets/fragments/table"
                    hx-target="#table-container"
                    hx-swap="outerHTML">
                    <input type="hidden" name="accountId" th:value="${selectedAccountId}">
                    <input type="hidden" name="type" th:value="${selectedAssetType}">
                    <input type="hidden" name="description" th:value="${selectedDescription}">
                    <input type="hidden" name="size" th:value="${pagination.pageSize}">
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.firstPage()}" th:disabled="${!pagination.hasPrevious()}">
                        <i data-lucide="chevrons-left" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.first}"></span>
                    </button>
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.previousPage()}" th:disabled="${!pagination.hasPrevious()}">
                        <i data-lucide="chevron-left" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.previous}"></span>
                    </button>
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.nextPage()}" th:disabled="${!pagination.hasNext()}">
                        <i data-lucide="chevron-right" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.next}"></span>
                    </button>
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.lastPage()}" th:disabled="${!pagination.hasNext()}">
                        <i data-lucide="chevrons-right" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.last}"></span>
                    </button>
                </form>
            </div>
            <div class="pagination-summary">
                <span th:text="#{pagination.summary.page(${pagination.currentPageDisplay()}, ${pagination.totalPages})}"></span>
                <span th:text="#{pagination.summary.range(${pagination.rangeStart}, ${pagination.rangeEnd}, ${pagination.totalItems})}"></span>
            </div>
        </div>

        <form
            th:action="@{/investments/assets/bulk-delete}"
            method="post"
            hx-post="/investments/assets/bulk-delete"
            hx-target="#table-container"
            hx-swap="outerHTML"
            th:attr="hx-confirm=#{investments.assets.list.confirm.bulkDelete}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="accountId" th:value="${selectedAccountId}">
            <input type="hidden" name="type" th:value="${selectedAssetType}">
            <input type="hidden" name="description" th:value="${selectedDescription}">
            <input type="hidden" name="page" th:value="${pagination != null ? pagination.page : 0}">
            <input type="hidden" name="size" th:value="${pagination != null ? pagination.pageSize : 25}">

            <div class="table-actions">
                <span class="selection-counter" aria-live="polite">
                    <i data-lucide="list-checks" aria-hidden="true"></i>
                    <span
                        data-selected-count-display
                        th:attr="data-label-singular=#{selection.counter.template.singular},data-label-plural=#{selection.counter.template.plural}"
                        th:text="#{selection.counter.plural(0)}">
                        0 registros selecionados
                    </span>
                </span>
                <button class="btn btn-danger" type="submit">
                    <i data-lucide="trash-2" aria-hidden="true"></i>
                    <span th:text="#{investments.assets.list.action.bulkDelete}"></span>
                </button>
            </div>

            <div class="table-wrap">
                <table class="responsive-list">
                    <thead>
                    <tr>
                        <th>
                            <button
                                class="table-select-all-toggle"
                                type="button"
                                th:attr="data-label-none=#{selection.toggle.none},data-label-some=#{selection.toggle.some},data-label-all=#{selection.toggle.all}">
                                <span class="table-heading-label" aria-hidden="true">
                                    <span data-state-icon="none">
                                        <i data-lucide="square" aria-hidden="true"></i>
                                    </span>
                                    <span data-state-icon="some" hidden>
                                        <i data-lucide="minus-square" aria-hidden="true"></i>
                                    </span>
                                    <span data-state-icon="all" hidden>
                                        <i data-lucide="check-square" aria-hidden="true"></i>
                                    </span>
                                </span>
                                <span class="sr-only" th:text="#{investments.assets.list.table.select}"></span>
                            </button>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="landmark" aria-hidden="true"></i>
                                <span th:text="#{investments.assets.list.table.name}"></span>
                            </span>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="hash" aria-hidden="true"></i>
                                <span th:text="#{investments.assets.list.table.ticker}"></span>
                            </span>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="layers" aria-hidden="true"></i>
                                <span th:text="#{investments.assets.list.table.type}"></span>
                            </span>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="briefcase" aria-hidden="true"></i>
                                <span th:text="#{investments.assets.list.table.account}"></span>
                            </span>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="building-2" aria-hidden="true"></i>
                                <span th:text="#{investments.assets.list.table.issuer}"></span>
                            </span>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="calendar-clock" aria-hidden="true"></i>
                                <span th:text="#{investments.assets.list.table.maturityDate}"></span>
                            </span>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="percent" aria-hidden="true"></i>
                                <span th:text="#{investments.assets.list.table.indexer}"></span>
                            </span>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="coins" aria-hidden="true"></i>
                                <span th:text="#{investments.assets.list.table.currency}"></span>
                            </span>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="settings" aria-hidden="true"></i>
                                <span th:text="#{investments.assets.list.table.actions}"></span>
                            </span>
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(assets)}" class="empty-row">
                        <td colspan="10" class="empty" th:text="#{investments.assets.list.empty}"></td>
                    </tr>
                    <tr th:each="asset : ${assets}">
                        <td class="cell-select" th:attr="data-label=#{investments.assets.list.table.select}">
                            <input type="checkbox" name="ids" th:value="${asset.id}" th:attr="aria-label=#{investments.assets.list.table.selectItem}">
                        </td>
                        <td th:attr="data-label=#{investments.assets.list.table.name}" th:text="${asset.name}"></td>
                        <td th:attr="data-label=#{investments.assets.list.table.ticker}" th:text="${asset.ticker != null && !asset.ticker.isBlank() ? asset.ticker : '-'}"></td>
                        <td th:attr="data-label=#{investments.assets.list.table.type}" th:text="#{${'asset.type.' + (asset.type != null ? asset.type.name().toLowerCase() : 'other')}}"></td>
                        <td th:attr="data-label=#{investments.assets.list.table.account}" th:text="${asset.account.title}"></td>
                        <td th:attr="data-label=#{investments.assets.list.table.issuer}" th:text="${asset.issuer != null && !asset.issuer.isBlank() ? asset.issuer : '-'}"></td>
                        <td
                            th:attr="data-label=#{investments.assets.list.table.maturityDate}"
                            th:text="${asset.maturityDate != null ? #temporals.format(asset.maturityDate, 'dd/MM/yyyy') : '-'}">
                        </td>
                        <td th:attr="data-label=#{investments.assets.list.table.indexer}">
                            <span th:text="#{${'asset.indexerType.' + (asset.indexerType != null ? asset.indexerType.name().toLowerCase() : 'none')}}"></span>
                            <span th:if="${asset.indexerSpread != null && !asset.indexerSpread.isBlank()}" th:text="${' - ' + asset.indexerSpread}"></span>
                        </td>
                        <td th:attr="data-label=#{investments.assets.list.table.currency}" th:text="${asset.currency}"></td>
                        <td class="cell-actions" th:attr="data-label=#{investments.assets.list.table.actions}">
                            <div class="actions-inline">
                                <a class="btn btn-secondary" th:href="@{/investments/assets/{id}/edit(id=${asset.id},returnTo=${returnTo})}">
                                    <i data-lucide="edit-3" aria-hidden="true"></i>
                                    <span th:text="#{investments.assets.list.action.edit}"></span>
                                </a>
                                <button
                                    class="btn btn-danger"
                                    type="button"
                                    th:attr="hx-post=@{/investments/assets/{id}/delete(id=${asset.id},accountId=${selectedAccountId},type=${selectedAssetType},description=${selectedDescription},page=${pagination != null ? pagination.page : 0},size=${pagination != null ? pagination.pageSize : 25})},hx-confirm=#{investments.assets.list.confirm.delete}"
                                    hx-target="#table-container"
                                    hx-swap="outerHTML">
                                    <i data-lucide="trash-2" aria-hidden="true"></i>
                                    <span th:text="#{investments.assets.list.action.delete}"></span>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>
</html>
