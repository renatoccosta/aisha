<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${mode == 'create'} ? #{investments.assets.form.title.create} : #{investments.assets.form.title.edit}"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/aisha-logo-simple.svg}">
</head>
<body>
<header th:replace="~{fragments/header :: topbar(subtitle=#{investments.assets.form.header.subtitle})}"></header>

<main class="wrap">
    <section class="card form-card">
        <h2 th:text="${mode == 'create'} ? #{investments.assets.form.title.create} : #{investments.assets.form.title.edit}"></h2>

        <form class="stack-form" th:object="${form}" th:action="${mode == 'create'} ? @{/investments/assets} : @{/investments/assets/{id}(id=${assetId})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="returnTo" th:value="${returnTo}">

            <div class="grid-2">
                <div class="field">
                    <label for="accountId" th:text="#{investments.assets.form.field.account.required}"></label>
                    <select id="accountId" th:field="*{accountId}" required>
                        <option value="" th:text="#{investments.assets.form.option.selectAccount}"></option>
                        <option th:each="account : ${accounts}" th:value="${account.id}" th:text="${account.title}"></option>
                    </select>
                    <p class="error" th:if="${#fields.hasErrors('accountId')}" th:errors="*{accountId}"></p>
                </div>

                <div class="field">
                    <label for="type" th:text="#{investments.assets.form.field.type.required}"></label>
                    <select id="type" th:field="*{type}" required>
                        <option th:each="assetType : ${assetTypes}" th:value="${assetType}" th:text="#{${'asset.type.' + assetType.name().toLowerCase()}}"></option>
                    </select>
                    <p class="error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></p>
                </div>
            </div>

            <div class="field">
                <label for="name" th:text="#{investments.assets.form.field.name.required}"></label>
                <input id="name" type="text" th:field="*{name}" maxlength="200" required>
                <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label for="ticker" th:text="#{investments.assets.form.field.ticker}"></label>
                    <input id="ticker" type="text" th:field="*{ticker}" maxlength="40">
                    <p class="error" th:if="${#fields.hasErrors('ticker')}" th:errors="*{ticker}"></p>
                </div>

                <div class="field">
                    <label for="isin" th:text="#{investments.assets.form.field.isin}"></label>
                    <input id="isin" type="text" th:field="*{isin}" maxlength="20">
                    <p class="error" th:if="${#fields.hasErrors('isin')}" th:errors="*{isin}"></p>
                </div>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label for="issuer" th:text="#{investments.assets.form.field.issuer}"></label>
                    <input id="issuer" type="text" th:field="*{issuer}" maxlength="200">
                    <p class="error" th:if="${#fields.hasErrors('issuer')}" th:errors="*{issuer}"></p>
                </div>

                <div class="field">
                    <label for="currency" th:text="#{investments.assets.form.field.currency.required}"></label>
                    <input id="currency" type="text" th:field="*{currency}" maxlength="3" required>
                    <p class="error" th:if="${#fields.hasErrors('currency')}" th:errors="*{currency}"></p>
                </div>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label for="maturityDate" th:text="#{investments.assets.form.field.maturityDate}"></label>
                    <input id="maturityDate" type="date" th:field="*{maturityDate}">
                    <p class="error" th:if="${#fields.hasErrors('maturityDate')}" th:errors="*{maturityDate}"></p>
                </div>

                <div class="field">
                    <label for="indexerType" th:text="#{investments.assets.form.field.indexerType.required}"></label>
                    <select id="indexerType" th:field="*{indexerType}" required>
                        <option th:each="indexerType : ${indexerTypes}" th:value="${indexerType}" th:text="#{${'asset.indexerType.' + indexerType.name().toLowerCase()}}"></option>
                    </select>
                    <p class="error" th:if="${#fields.hasErrors('indexerType')}" th:errors="*{indexerType}"></p>
                </div>
            </div>

            <div class="field field-half">
                <label for="indexerSpread" th:text="#{investments.assets.form.field.indexerSpread}"></label>
                <input id="indexerSpread" type="text" th:field="*{indexerSpread}" maxlength="80">
                <p class="error" th:if="${#fields.hasErrors('indexerSpread')}" th:errors="*{indexerSpread}"></p>
            </div>

            <section class="card stack-sm">
                <h3 th:text="#{investments.assets.form.section.openingPosition}"></h3>

                <div class="grid-2">
                    <div class="field">
                        <label for="openingPositionDate" th:text="#{investments.assets.form.field.openingPositionDate}"></label>
                        <input id="openingPositionDate" type="date" th:field="*{openingPositionDate}">
                        <p class="error" th:if="${#fields.hasErrors('openingPositionDate')}" th:errors="*{openingPositionDate}"></p>
                    </div>

                    <div class="field">
                        <label for="openingPositionCurrency" th:text="#{investments.assets.form.field.openingPositionCurrency}"></label>
                        <input id="openingPositionCurrency" type="text" th:field="*{openingPositionCurrency}" maxlength="3">
                        <p class="error" th:if="${#fields.hasErrors('openingPositionCurrency')}" th:errors="*{openingPositionCurrency}"></p>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="field">
                        <label for="openingPositionQuantity" th:text="#{investments.assets.form.field.openingPositionQuantity}"></label>
                        <input id="openingPositionQuantity" type="number" th:field="*{openingPositionQuantity}" step="0.0000000001">
                        <p class="error" th:if="${#fields.hasErrors('openingPositionQuantity')}" th:errors="*{openingPositionQuantity}"></p>
                    </div>

                    <div class="field">
                        <label for="openingPositionTotalCost" th:text="#{investments.assets.form.field.openingPositionTotalCost}"></label>
                        <input id="openingPositionTotalCost" type="number" th:field="*{openingPositionTotalCost}" step="0.01">
                        <p class="error" th:if="${#fields.hasErrors('openingPositionTotalCost')}" th:errors="*{openingPositionTotalCost}"></p>
                    </div>
                </div>
            </section>

            <div class="actions-inline">
                <button class="btn btn-primary" type="submit">
                    <i data-lucide="save" aria-hidden="true"></i>
                    <span th:text="${mode == 'create'} ? #{investments.assets.form.action.save} : #{investments.assets.form.action.update}"></span>
                </button>
                <a class="btn btn-secondary" th:href="${returnTo}">
                    <i data-lucide="arrow-left" aria-hidden="true"></i>
                    <span th:text="#{investments.assets.form.action.cancel}"></span>
                </a>
            </div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>
</html>
