<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{investments.title}"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/aisha-logo-simple.svg}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<header th:replace="~{fragments/header :: topbar(subtitle=#{investments.header.subtitle})}"></header>

<main class="wrap">
    <section class="card form-card">
        <h2 th:text="#{investments.heading}"></h2>
        <p th:text="#{investments.subtitle}"></p>
    </section>

    <section class="admin-grid">
        <a class="card admin-nav-card" th:href="@{/investments/assets}">
            <div class="admin-nav-card-icon">
                <i data-lucide="landmark" aria-hidden="true"></i>
            </div>
            <div>
                <h3 th:text="#{investments.assets.heading}"></h3>
                <p th:text="#{investments.assets.subtitle}"></p>
            </div>
        </a>

        <a class="card admin-nav-card" th:href="@{/investments/operations}">
            <div class="admin-nav-card-icon">
                <i data-lucide="repeat-2" aria-hidden="true"></i>
            </div>
            <div>
                <h3 th:text="#{investments.operations.heading}"></h3>
                <p th:text="#{investments.operations.subtitle}"></p>
            </div>
        </a>

        <a class="card admin-nav-card" th:href="@{/investments/brokerage-note-import}">
            <div class="admin-nav-card-icon">
                <i data-lucide="file-up" aria-hidden="true"></i>
            </div>
            <div>
                <h3 th:text="#{investments.brokerageNoteImport.nav.heading}"></h3>
                <p th:text="#{investments.brokerageNoteImport.nav.subtitle}"></p>
            </div>
        </a>
    </section>
</main>
<footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>
</html>
