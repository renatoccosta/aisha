<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{auth.login.title}"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/aisha-logo-simple.svg}">
    <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script defer th:src="@{/js/lucide-init.js}"></script>
</head>
<body>
<main class="wrap auth-main">
    <section class="card auth-card">
        <div class="auth-brand">
            <img class="brand-logo" th:src="@{/img/aisha-logo-full.svg}" th:alt="#{app.logo.alt}">
            <h1 th:text="#{auth.login.heading}"></h1>
            <p th:text="#{auth.login.subtitle}"></p>
        </div>

        <p class="error" th:if="${param.error}" th:text="#{auth.login.error}"></p>
        <p class="error" th:if="${param.linkError}" th:text="#{auth.login.link.error}"></p>
        <p class="helper" th:if="${param.logout}" th:text="#{auth.login.logout.success}"></p>
        <p class="helper" th:if="${param.expired}" th:text="#{auth.login.expired}"></p>

        <form method="post" th:action="@{/login}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="field">
                <label for="username" th:text="#{auth.login.field.username}"></label>
                <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            </div>

            <div class="field">
                <label for="password" th:text="#{auth.login.field.password}"></label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>

            <div class="actions-inline auth-actions">
                <button class="btn btn-primary" type="submit">
                    <i data-lucide="lock" aria-hidden="true"></i>
                    <span th:text="#{auth.login.action.submit}"></span>
                </button>
            </div>
        </form>

        <th:block th:if="${!#lists.isEmpty(externalLoginProviders)}">
            <div class="auth-divider" role="separator" th:text="#{auth.login.divider}"></div>

            <a class="btn btn-secondary"
               th:each="provider : ${externalLoginProviders}"
               th:href="${provider.authorizationUri}">
                <i th:attr="data-lucide=${provider.icon}" aria-hidden="true"></i>
                <span th:text="#{__${provider.labelMessageKey}__}"></span>
            </a>
        </th:block>

        <form method="post" th:if="${pendingFederatedLink != null}" th:action="@{/auth/federated/link}" th:object="${federatedLinkForm}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <p class="helper" th:text="#{auth.login.link.info(${pendingFederatedLink.email})}"></p>

            <div class="field">
                <label for="linkPassword" th:text="#{auth.login.link.password}"></label>
                <input id="linkPassword" type="password" th:field="*{password}" autocomplete="current-password" required>
            </div>

            <div class="actions-inline auth-actions">
                <button class="btn btn-primary" type="submit">
                    <i data-lucide="link" aria-hidden="true"></i>
                    <span th:text="#{auth.login.link.confirm}"></span>
                </button>
            </div>
        </form>

    </section>
</main>
<footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>
</html>
