<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{dashboard.title}"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/aisha-logo-simple.svg}">
    <script th:src="@{/webjars/chart.js/4.5.1/dist/chart.umd.min.js}"></script>
</head>
<body>
<header th:replace="~{fragments/header :: topbar(subtitle=#{dashboard.header.subtitle})}"></header>

<main class="wrap dashboard-main">
    <section class="dashboard-card-grid">
        <article class="card summary-card summary-card-balance loading" id="summary-current-balance">
            <div class="summary-card-head">
                <span class="summary-icon" aria-hidden="true">
                    <i data-lucide="briefcase" aria-hidden="true"></i>
                </span>
                <h2 th:text="#{dashboard.card.currentBalance}"></h2>
            </div>
            <p class="summary-value skeleton-line" data-role="value">R$ 0,00</p>
            <p class="summary-variation skeleton-line" data-role="variation" th:text="#{dashboard.loading}"></p>
        </article>

        <article class="card summary-card summary-card-expense loading" id="summary-total-expenses">
            <div class="summary-card-head">
                <span class="summary-icon" aria-hidden="true">
                    <i data-lucide="arrow-down-right" aria-hidden="true"></i>
                </span>
                <h2 th:text="#{dashboard.card.totalExpenses}"></h2>
            </div>
            <p class="summary-value skeleton-line" data-role="value">R$ 0,00</p>
            <p class="summary-variation skeleton-line" data-role="variation" th:text="#{dashboard.loading}"></p>
        </article>

        <article class="card summary-card summary-card-revenue loading" id="summary-total-revenues">
            <div class="summary-card-head">
                <span class="summary-icon" aria-hidden="true">
                    <i data-lucide="arrow-up-right" aria-hidden="true"></i>
                </span>
                <h2 th:text="#{dashboard.card.totalRevenues}"></h2>
            </div>
            <p class="summary-value skeleton-line" data-role="value">R$ 0,00</p>
            <p class="summary-variation skeleton-line" data-role="variation" th:text="#{dashboard.loading}"></p>
        </article>
    </section>

    <section class="card investments-overview-card">
        <div class="section-heading">
            <div>
                <h2 class="chart-title">
                    <i data-lucide="landmark" aria-hidden="true"></i>
                    <span th:text="#{dashboard.investments.heading}"></span>
                </h2>
                <p th:text="#{dashboard.investments.subtitle}"></p>
            </div>
        </div>
        <div class="dashboard-card-grid investments-summary-grid">
            <article class="card summary-card summary-card-balance loading" id="investment-position-cost-card">
                <div class="summary-card-head">
                    <span class="summary-icon" aria-hidden="true">
                        <i data-lucide="wallet" aria-hidden="true"></i>
                    </span>
                    <h3 th:text="#{dashboard.investments.positionCost}"></h3>
                </div>
                <p class="summary-value skeleton-line" data-role="value">R$ 0,00</p>
                <p class="summary-variation skeleton-line" data-role="variation" th:text="#{dashboard.loading}"></p>
            </article>

            <article class="card summary-card summary-card-expense loading" id="investment-net-flow-card">
                <div class="summary-card-head">
                    <span class="summary-icon" aria-hidden="true">
                        <i data-lucide="arrow-right-left" aria-hidden="true"></i>
                    </span>
                    <h3 th:text="#{dashboard.investments.netFlow}"></h3>
                </div>
                <p class="summary-value skeleton-line" data-role="value">R$ 0,00</p>
                <p class="summary-variation skeleton-line" data-role="variation" th:text="#{dashboard.loading}"></p>
            </article>

            <article class="card summary-card summary-card-revenue loading" id="investment-income-card">
                <div class="summary-card-head">
                    <span class="summary-icon" aria-hidden="true">
                        <i data-lucide="badge-dollar-sign" aria-hidden="true"></i>
                    </span>
                    <h3 th:text="#{dashboard.investments.income}"></h3>
                </div>
                <p class="summary-value skeleton-line" data-role="value">R$ 0,00</p>
                <p class="summary-variation skeleton-line" data-role="variation" th:text="#{dashboard.loading}"></p>
            </article>

            <article class="card summary-card summary-card-neutral loading" id="investment-open-assets-card">
                <div class="summary-card-head">
                    <span class="summary-icon" aria-hidden="true">
                        <i data-lucide="layers-3" aria-hidden="true"></i>
                    </span>
                    <h3 th:text="#{dashboard.investments.openAssets}"></h3>
                </div>
                <p class="summary-value skeleton-line" data-role="value">0</p>
                <p class="summary-variation skeleton-line" data-role="variation" th:text="#{dashboard.loading}"></p>
            </article>

        </div>
        <p class="chart-meta loading" id="investment-excluded-meta" th:text="#{dashboard.loading}"></p>
    </section>

    <section class="dashboard-investment-flow-grid">
        <article class="card chart-card loading" id="investment-allocation-type-card">
            <div class="chart-card-head">
                <div>
                    <h2 class="chart-title">
                        <i data-lucide="pie-chart" aria-hidden="true"></i>
                        <span th:text="#{dashboard.investments.allocationByType.title}"></span>
                    </h2>
                    <p th:text="#{dashboard.investments.allocationByType.subtitle}"></p>
                </div>
            </div>
            <p class="chart-meta" id="investment-allocation-type-meta" th:text="#{dashboard.loading}"></p>
            <div class="chart-wrap chart-wrap-donut">
                <canvas id="investment-allocation-type-chart" th:attr="aria-label=#{dashboard.investments.allocationByType.title}"></canvas>
            </div>
        </article>

        <article class="card chart-card loading" id="investment-flow-chart-card">
            <div class="chart-card-head">
                <div>
                    <h2 class="chart-title">
                        <i data-lucide="chart-column-big" aria-hidden="true"></i>
                        <span th:text="#{dashboard.investments.flowChart.title}"></span>
                    </h2>
                    <p th:text="#{dashboard.investments.flowChart.subtitle}"></p>
                </div>
            </div>
            <p class="chart-meta" id="investment-flow-chart-meta" th:text="#{dashboard.loading}"></p>
            <div class="chart-wrap">
                <canvas id="investment-flow-chart" th:attr="aria-label=#{dashboard.investments.flowChart.title}"></canvas>
            </div>
        </article>
    </section>

    <section class="dashboard-balance-grid">
        <article class="card chart-card loading" id="account-type-balances-card">
            <div class="chart-card-head">
                <div>
                    <h2 class="chart-title">
                        <i data-lucide="wallet-cards" aria-hidden="true"></i>
                        <span th:text="#{dashboard.accountTypeBalances.title}"></span>
                    </h2>
                </div>
                <button class="btn btn-secondary" id="account-type-balances-drill-up" type="button" disabled>
                    <i data-lucide="arrow-up" aria-hidden="true"></i>
                    <span th:text="#{dashboard.accountTypeBalances.drillUp}"></span>
                </button>
            </div>
            <p class="chart-meta" id="account-type-balances-meta" th:text="#{dashboard.loading}"></p>
            <div class="chart-wrap chart-wrap-donut">
                <canvas id="account-type-balances-chart" th:attr="aria-label=#{dashboard.accountTypeBalances.title}"></canvas>
            </div>
        </article>

        <article class="card chart-card loading" id="balance-chart-card">
            <div class="chart-card-head">
                <div>
                    <h2 class="chart-title">
                        <i data-lucide="line-chart" aria-hidden="true"></i>
                        <span th:text="#{dashboard.chart.title}"></span>
                    </h2>
                    <p th:text="#{dashboard.chart.subtitle}"></p>
                </div>
                <div class="chart-mode-selector" role="group" th:attr="aria-label=#{dashboard.chart.mode.aria}">
                    <button class="btn btn-secondary btn-active" type="button" data-mode="accumulated">
                        <i data-lucide="trending-up" aria-hidden="true"></i>
                        <span th:text="#{dashboard.chart.mode.accumulated}"></span>
                    </button>
                    <button class="btn btn-secondary" type="button" data-mode="period">
                        <i data-lucide="bar-chart-2" aria-hidden="true"></i>
                        <span th:text="#{dashboard.chart.mode.period}"></span>
                    </button>
                </div>
            </div>
            <p class="chart-meta" id="balance-chart-meta" th:text="#{dashboard.loading}"></p>
            <div class="chart-wrap">
                <canvas id="balance-evolution-chart" th:attr="aria-label=#{dashboard.chart.title}"></canvas>
            </div>
        </article>
    </section>

    <section class="card chart-card loading" id="revenues-expenses-chart-card">
        <div class="chart-card-head">
            <div>
                <h2 class="chart-title">
                    <i data-lucide="bar-chart-3" aria-hidden="true"></i>
                    <span th:text="#{dashboard.revenueExpenseChart.title}"></span>
                </h2>
                <p th:text="#{dashboard.revenueExpenseChart.subtitle}"></p>
            </div>
        </div>
        <p class="chart-meta" id="revenues-expenses-chart-meta" th:text="#{dashboard.loading}"></p>
        <div class="chart-wrap">
            <canvas id="revenues-expenses-chart" th:attr="aria-label=#{dashboard.revenueExpenseChart.title}"></canvas>
        </div>
    </section>

    <section class="dashboard-chart-grid">
        <article class="card chart-card loading" id="expense-category-chart-card">
            <div class="chart-card-head">
                <div>
                    <h2 class="chart-title">
                        <i data-lucide="pie-chart" aria-hidden="true"></i>
                        <span th:text="#{dashboard.expenseCategoryChart.title}"></span>
                    </h2>
                    <p th:text="#{dashboard.expenseCategoryChart.subtitle}"></p>
                </div>
                <button class="btn btn-secondary" id="expense-category-drill-up" type="button" disabled>
                    <i data-lucide="arrow-up" aria-hidden="true"></i>
                    <span th:text="#{dashboard.expenseCategoryChart.drillUp}"></span>
                </button>
            </div>
            <p class="chart-meta" id="expense-category-chart-meta" th:text="#{dashboard.loading}"></p>
            <div class="chart-wrap">
                <canvas id="expense-category-chart" th:attr="aria-label=#{dashboard.expenseCategoryChart.title}"></canvas>
            </div>
        </article>

        <article class="card chart-card loading" id="revenue-category-chart-card">
            <div class="chart-card-head">
                <div>
                    <h2 class="chart-title">
                        <i data-lucide="chart-pie" aria-hidden="true"></i>
                        <span th:text="#{dashboard.revenueCategoryChart.title}"></span>
                    </h2>
                    <p th:text="#{dashboard.revenueCategoryChart.subtitle}"></p>
                </div>
                <button class="btn btn-secondary" id="revenue-category-drill-up" type="button" disabled>
                    <i data-lucide="arrow-up" aria-hidden="true"></i>
                    <span th:text="#{dashboard.revenueCategoryChart.drillUp}"></span>
                </button>
            </div>
            <p class="chart-meta" id="revenue-category-chart-meta" th:text="#{dashboard.loading}"></p>
            <div class="chart-wrap">
                <canvas id="revenue-category-chart" th:attr="aria-label=#{dashboard.revenueCategoryChart.title}"></canvas>
            </div>
        </article>
    </section>

    <section class="card chart-card loading" id="category-totals-chart-card">
        <div class="chart-card-head">
            <div>
                <h2 class="chart-title">
                    <i data-lucide="chart-column-stacked" aria-hidden="true"></i>
                    <span th:text="#{dashboard.categoryTotalsChart.title}"></span>
                </h2>
                <p th:text="#{dashboard.categoryTotalsChart.subtitle}"></p>
            </div>
            <button class="btn btn-secondary" id="category-totals-drill-up" type="button" disabled>
                <i data-lucide="arrow-up" aria-hidden="true"></i>
                <span th:text="#{dashboard.categoryTotalsChart.drillUp}"></span>
            </button>
        </div>
        <p class="chart-meta" id="category-totals-chart-meta" th:text="#{dashboard.loading}"></p>
        <div class="chart-wrap">
            <canvas id="category-totals-chart" th:attr="aria-label=#{dashboard.categoryTotalsChart.title}"></canvas>
        </div>
    </section>
</main>

<script th:inline="javascript">
    const i18n = {
        loading: /*[[#{dashboard.loading}]]*/ "Carregando...",
        unavailablePrevious: /*[[#{dashboard.variation.previousUnavailable}]]*/ "Sem base de comparação no período anterior",
        variationUp: /*[[#{dashboard.variation.up}]]*/ "acima do período anterior",
        variationDown: /*[[#{dashboard.variation.down}]]*/ "abaixo do período anterior",
        variationStable: /*[[#{dashboard.variation.stable}]]*/ "igual ao período anterior",
        chartGranularityDay: /*[[#{dashboard.chart.granularity.day}]]*/ "diário",
        chartGranularityMonth: /*[[#{dashboard.chart.granularity.month}]]*/ "mensal",
        chartMetaGranularity: /*[[#{dashboard.chart.metaGranularity}]]*/ "Granularidade: {0}",
        chartSeriesAccumulated: /*[[#{dashboard.chart.series.accumulated}]]*/ "Saldo acumulado",
        chartSeriesPeriod: /*[[#{dashboard.chart.series.period}]]*/ "Movimentação no período",
        chartLoadError: /*[[#{dashboard.chart.error}]]*/ "Não foi possível carregar o gráfico.",
        summaryLoadError: /*[[#{dashboard.summary.error}]]*/ "Não foi possível carregar este indicador.",
        accountTypeBalancesLoadError: /*[[#{dashboard.accountTypeBalances.error}]]*/ "Não foi possível carregar os saldos por tipo de conta.",
        accountTypeBalancesEmpty: /*[[#{dashboard.accountTypeBalances.empty}]]*/ "Sem contas para exibir saldos por tipo.",
        accountTypeBalancesLevelRoot: /*[[#{dashboard.accountTypeBalances.level.root}]]*/ "Nível: tipos de conta",
        accountTypeBalancesLevelChild: /*[[#{dashboard.accountTypeBalances.level.child}]]*/ "Nível: contas do tipo {0}",
        revenueExpenseChartSeriesRevenue: /*[[#{dashboard.revenueExpenseChart.series.revenues}]]*/ "Receitas",
        revenueExpenseChartSeriesExpense: /*[[#{dashboard.revenueExpenseChart.series.expenses}]]*/ "Despesas",
        revenueExpenseChartLoadError: /*[[#{dashboard.revenueExpenseChart.error}]]*/ "Não foi possível carregar o gráfico de receitas vs despesas.",
        expenseCategoryChartLoadError: /*[[#{dashboard.expenseCategoryChart.error}]]*/ "Não foi possível carregar o gráfico de gastos por categoria.",
        expenseCategoryChartEmpty: /*[[#{dashboard.expenseCategoryChart.empty}]]*/ "Sem despesas no período",
        expenseCategoryChartLevelRoot: /*[[#{dashboard.expenseCategoryChart.level.root}]]*/ "Nível: categorias raiz",
        expenseCategoryChartLevelChild: /*[[#{dashboard.expenseCategoryChart.level.child}]]*/ "Nível: subcategorias de {0}",
        revenueCategoryChartLoadError: /*[[#{dashboard.revenueCategoryChart.error}]]*/ "Não foi possível carregar o gráfico de recebimentos por categoria.",
        revenueCategoryChartEmpty: /*[[#{dashboard.revenueCategoryChart.empty}]]*/ "Sem recebimentos no período",
        revenueCategoryChartLevelRoot: /*[[#{dashboard.revenueCategoryChart.level.root}]]*/ "Nível: categorias raiz",
        revenueCategoryChartLevelChild: /*[[#{dashboard.revenueCategoryChart.level.child}]]*/ "Nível: subcategorias de {0}",
        categoryTotalsChartLoadError: /*[[#{dashboard.categoryTotalsChart.error}]]*/ "Não foi possível carregar o gráfico de totais por categoria.",
        categoryTotalsChartEmpty: /*[[#{dashboard.categoryTotalsChart.empty}]]*/ "Sem dados no período",
        categoryTotalsChartLevelRoot: /*[[#{dashboard.categoryTotalsChart.level.root}]]*/ "Nível: categorias raiz",
        categoryTotalsChartLevelChild: /*[[#{dashboard.categoryTotalsChart.level.child}]]*/ "Nível: subcategorias de {0}",
        investmentAllocationByTypeEmpty: /*[[#{dashboard.investments.allocationByType.empty}]]*/ "Sem posição por custo para exibir.",
        investmentAllocationByTypeError: /*[[#{dashboard.investments.allocationByType.error}]]*/ "Não foi possível carregar a alocação por custo.",
        investmentFlowChartError: /*[[#{dashboard.investments.flowChart.error}]]*/ "Não foi possível carregar o fluxo do período.",
        investmentFlowSeriesInflows: /*[[#{dashboard.investments.flowChart.series.inflows}]]*/ "Entradas",
        investmentFlowSeriesOutflows: /*[[#{dashboard.investments.flowChart.series.outflows}]]*/ "Saídas",
        investmentFlowSeriesNet: /*[[#{dashboard.investments.flowChart.series.net}]]*/ "Fluxo líquido",
        investmentExcludedNone: /*[[#{dashboard.investments.excluded.none}]]*/ "Todos os dados de investimentos elegíveis foram consolidados em BRL.",
        investmentExcludedAssetsOnly: /*[[#{dashboard.investments.excluded.assetsOnly}]]*/ "{0} ativo(s) fora do padrão BRL não entraram na visão consolidada.",
        investmentExcludedOperationsOnly: /*[[#{dashboard.investments.excluded.operationsOnly}]]*/ "{0} operação(ões) fora do padrão BRL não entraram no fluxo consolidado.",
        investmentExcludedAssetsAndOperations: /*[[#{dashboard.investments.excluded.assetsAndOperations}]]*/ "{0} ativo(s) e {1} operação(ões) fora do padrão BRL não entraram na visão consolidada.",
        accountTypeChecking: /*[[#{account.type.checking}]]*/ "Corrente",
        accountTypeCredit: /*[[#{account.type.credit}]]*/ "Crédito",
        accountTypeInvestment: /*[[#{account.type.investment}]]*/ "Investimento",
        accountTypeFood: /*[[#{account.type.food}]]*/ "Alimentação",
        accountTypeOther: /*[[#{account.type.other}]]*/ "Outros",
        assetTypeStock: /*[[#{asset.type.stock}]]*/ "Ação",
        assetTypeEtf: /*[[#{asset.type.etf}]]*/ "ETF",
        assetTypeFii: /*[[#{asset.type.fii}]]*/ "FII",
        assetTypeBondGov: /*[[#{asset.type.bond_gov}]]*/ "Título público",
        assetTypeBondBank: /*[[#{asset.type.bond_bank}]]*/ "Título bancário",
        assetTypeMutualFund: /*[[#{asset.type.mutual_fund}]]*/ "Fundo",
        assetTypePrivatePension: /*[[#{asset.type.private_pension}]]*/ "Previdência privada",
        assetTypeCrypto: /*[[#{asset.type.crypto}]]*/ "Cripto",
        assetTypeOther: /*[[#{asset.type.other}]]*/ "Outro"
    };

    const BRL_FORMATTER = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
    const PERCENT_FORMATTER = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const INTEGER_FORMATTER = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 });
    const DATE_FORMATTER = new Intl.DateTimeFormat("pt-BR");
    const MONTH_FORMATTER = new Intl.DateTimeFormat("pt-BR", { month: "short", year: "numeric" });
    let accountTypeBalancesChart = null;
    let accountTypeBalancesPayload = [];
    let accountBalancesPayload = [];
    let accountTypeBalancesDrillDownType = null;
    let investmentAllocationTypeChart = null;
    let investmentAllocationTypePayload = [];
    let investmentFlowChart = null;
    let investmentFlowPayload = null;
    let balanceChart = null;
    let chartPayload = null;
    let revenueExpenseChart = null;
    let revenueExpensePayload = null;
    let expenseCategoryChart = null;
    let expenseCategoryPayload = null;
    let expenseCategoryDrillUpParentId = null;
    let revenueCategoryChart = null;
    let revenueCategoryPayload = null;
    let revenueCategoryDrillUpParentId = null;
    let categoryTotalsChart = null;
    let categoryTotalsPayload = null;
    let categoryTotalsDrillUpParentId = null;

    function formatCurrency(value) {
        return BRL_FORMATTER.format(Number(value ?? 0));
    }

    function formatDate(isoDate) {
        return DATE_FORMATTER.format(new Date(`${isoDate}T00:00:00`));
    }

    function formatMonth(isoDate) {
        return MONTH_FORMATTER.format(new Date(`${isoDate}T00:00:00`));
    }

    function getThemeColor(variableName, fallback) {
        const color = getComputedStyle(document.documentElement).getPropertyValue(variableName).trim();
        return color || fallback;
    }

    function getChartTheme() {
        return {
            text: getThemeColor("--color-text-secondary", "#35506a"),
            grid: getThemeColor("--color-border-default", "#d7e0e8"),
            surface: getThemeColor("--color-bg-card", "#ffffff")
        };
    }

    function accountTypeLabel(accountType) {
        const key = (accountType || "OTHER").toUpperCase();
        switch (key) {
            case "CHECKING": return i18n.accountTypeChecking;
            case "CREDIT": return i18n.accountTypeCredit;
            case "INVESTMENT": return i18n.accountTypeInvestment;
            case "FOOD": return i18n.accountTypeFood;
            default: return i18n.accountTypeOther;
        }
    }

    function assetTypeLabel(assetType) {
        const key = (assetType || "OTHER").toUpperCase();
        switch (key) {
            case "STOCK": return i18n.assetTypeStock;
            case "ETF": return i18n.assetTypeEtf;
            case "FII": return i18n.assetTypeFii;
            case "BOND_GOV": return i18n.assetTypeBondGov;
            case "BOND_BANK": return i18n.assetTypeBondBank;
            case "MUTUAL_FUND": return i18n.assetTypeMutualFund;
            case "PRIVATE_PENSION": return i18n.assetTypePrivatePension;
            case "CRYPTO": return i18n.assetTypeCrypto;
            default: return i18n.assetTypeOther;
        }
    }

    function renderAccountTypeBalances(items) {
        const card = document.getElementById("account-type-balances-card");
        const meta = document.getElementById("account-type-balances-meta");
        const canvas = document.getElementById("account-type-balances-chart");
        const drillUpButton = document.getElementById("account-type-balances-drill-up");
        if (!card || !meta || !canvas) {
            return;
        }

        const chartTheme = getChartTheme();
        card.classList.remove("loading");
        const rows = Array.isArray(items) ? items : [];
        accountTypeBalancesPayload = rows;
        const accountRows = Array.isArray(accountBalancesPayload)
            ? accountBalancesPayload.filter((item) => item.accountType === accountTypeBalancesDrillDownType)
            : [];
        const isDrillDown = accountTypeBalancesDrillDownType !== null;
        const sourceRows = isDrillDown ? accountRows : rows;
        const hasBalances = sourceRows.some((item) => Math.abs(Number(item.balance ?? 0)) > 0);
        const labels = hasBalances
            ? sourceRows.map((item) => isDrillDown ? item.accountTitle : accountTypeLabel(item.accountType))
            : [i18n.accountTypeBalancesEmpty];
        const data = hasBalances
            ? sourceRows.map((item) => Math.abs(Number(item.balance ?? 0)))
            : [1];
        const colors = hasBalances
            ? ["#19647e", "#42e2b8", "#eb8a90", "#07004d", "#f0ec57", "#8cb7c7"]
            : ["#d7e0e8"];

        if (!hasBalances) {
            meta.textContent = i18n.accountTypeBalancesEmpty;
        } else if (isDrillDown) {
            meta.textContent = i18n.accountTypeBalancesLevelChild.replace("{0}", accountTypeLabel(accountTypeBalancesDrillDownType));
        } else {
            meta.textContent = i18n.accountTypeBalancesLevelRoot;
        }
        if (drillUpButton) {
            drillUpButton.disabled = !isDrillDown;
        }

        if (accountTypeBalancesChart) {
            accountTypeBalancesChart.destroy();
        }

        accountTypeBalancesChart = new Chart(canvas, {
            type: "doughnut",
            data: {
                labels,
                datasets: [{
                    data,
                    backgroundColor: colors,
                    borderColor: chartTheme.surface,
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: "bottom",
                        labels: {
                            color: chartTheme.text
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: (context) => {
                                if (!hasBalances) {
                                    return context.label;
                                }
                                const item = sourceRows[context.dataIndex];
                                return `${context.label}: ${formatCurrency(item?.balance)}`;
                            }
                        }
                    }
                },
                onClick: (_, elements) => {
                    if (!hasBalances || isDrillDown || elements.length === 0) {
                        return;
                    }
                    const selectedItem = rows[elements[0].index];
                    if (!selectedItem) {
                        return;
                    }

    function renderMetric(cardId, metric) {
        const card = document.getElementById(cardId);
        if (!card) {
            return;
        }

        card.classList.remove("loading");
        const valueElement = card.querySelector('[data-role="value"]');
        const variationElement = card.querySelector('[data-role="variation"]');

        valueElement.textContent = formatCurrency(metric.currentValue);
        valueElement.classList.remove("skeleton-line");

        variationElement.classList.remove("skeleton-line", "variation-up", "variation-down", "variation-stable");
        if (metric.variationPercent === null) {
            variationElement.textContent = i18n.unavailablePrevious;
            return;
        }

        const percent = Number(metric.variationPercent);
        const absPercent = PERCENT_FORMATTER.format(Math.abs(percent));
        if (percent > 0) {
            variationElement.textContent = `+${absPercent}% ${i18n.variationUp}`;
            variationElement.classList.add("variation-up");
            return;
        }
        if (percent < 0) {
            variationElement.textContent = `-${absPercent}% ${i18n.variationDown}`;
            variationElement.classList.add("variation-down");
            return;
        }

        variationElement.textContent = `0,00% ${i18n.variationStable}`;
        variationElement.classList.add("variation-stable");
    }

    }

    function buildInvestmentExcludedMessage(overview) {
        const excludedAssets = Number(overview?.excludedAssetCount ?? 0);
        const excludedOperations = Number(overview?.excludedOperationCount ?? 0);
        if (excludedAssets > 0 && excludedOperations > 0) {
            return i18n.investmentExcludedAssetsAndOperations
                .replace("{0}", INTEGER_FORMATTER.format(excludedAssets))
                .replace("{1}", INTEGER_FORMATTER.format(excludedOperations));
        }
        if (excludedAssets > 0) {
            return i18n.investmentExcludedAssetsOnly.replace("{0}", INTEGER_FORMATTER.format(excludedAssets));
        }
        if (excludedOperations > 0) {
            return i18n.investmentExcludedOperationsOnly.replace("{0}", INTEGER_FORMATTER.format(excludedOperations));
        }
        return i18n.investmentExcludedNone;
    }

    function renderInvestmentAllocationChart(canvasId, items, emptyMessage, chartRefName, labelMapper = (item) => item.label) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) {
            return null;
        }

        const chartTheme = getChartTheme();
        const rows = Array.isArray(items) ? items : [];
        const hasItems = rows.length > 0;
        const labels = hasItems ? rows.map(labelMapper) : [emptyMessage];
        const data = hasItems ? rows.map((item) => Number(item.amount ?? 0)) : [1];
        const colors = hasItems
            ? ["#19647e", "#42e2b8", "#eb8a90", "#07004d", "#f0ec57", "#8cb7c7", "#22bf96", "#cf6770"]
            : ["#d7e0e8"];

        if (chartRefName === "type" && investmentAllocationTypeChart) {
            investmentAllocationTypeChart.destroy();

        const chart = new Chart(canvas, {
            type: "doughnut",
            data: {
                labels,
                datasets: [{
                    data,
                    backgroundColor: colors,
                    borderColor: chartTheme.surface,
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: "bottom",
                        labels: {

                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: (context) => {
                                if (!hasItems) {
                                    return context.label;
                                }
                                const row = rows[context.dataIndex];
                                return `${context.label}: ${formatCurrency(row?.amount)}`;

                        }

            ))
            : [i18n.categoryTotalsChartEmpty];

        const palette = ["#19647e", "#42e2b8", "#eb8a90", "#07004d", "#f0ec57", "#8cb7c7", "#22bf96", "#cf6770"];
        const datasets = hasData
            ? categoryTotalsPayload.series.map((series, index) => ({
                label: series.categoryName,
                data: series.values.map((value) => Number(value)),
                backgroundColor: palette[index % palette.length],
                borderColor: chartTheme.surface,
                borderWidth: 1,
                stack: "categoryTotals"
            }))
            : [{
                label: i18n.categoryTotalsChartEmpty,
                data: [0],
                backgroundColor: "#d7e0e8",
                stack: "categoryTotals"
            }];

        if (categoryTotalsChart) {
            categoryTotalsChart.destroy();
        }

        categoryTotalsChart = new Chart(canvas, {
            type: "bar",
            data: { labels, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        stacked: true,
                        grid: {
                            color: chartTheme.grid
                        },
                        ticks: {
                            color: chartTheme.text
                        }
                    },
                    y: {
                        stacked: true,
                        grid: {
                            color: chartTheme.grid
                        },
                        ticks: {
                            color: chartTheme.text,
                            callback: (value) => formatCurrency(value)
                        }
                    }
                },
                plugins: {
                    legend: {
                        position: "bottom",
                        labels: {
                            color: chartTheme.text
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: (context) => `${context.dataset.label}: ${formatCurrency(context.raw)}`
                        }
                    }
                },
                onClick: (_, elements) => {
                    if (!hasData || elements.length === 0) {
                        return;
                    }
                    const selectedSeries = categoryTotalsPayload.series[elements[0].datasetIndex];
                    if (!selectedSeries || !selectedSeries.hasChildren) {
                        return;
                    }
                    loadCategoryTotalsEvolution(selectedSeries.categoryId);
                }
            }
        });
    }

    async function loadCategoryTotalsEvolution(parentCategoryId = null) {
        const card = document.getElementById("category-totals-chart-card");
        const meta = document.getElementById("category-totals-chart-meta");
        const drillUpButton = document.getElementById("category-totals-drill-up");
        if (!card || !meta) {
            return;
        }

        try {
            const url = new URL("/api/dashboard/category-totals", window.location.origin);
            if (parentCategoryId !== null) {
                url.searchParams.set("parentCategoryId", String(parentCategoryId));
            }

            const response = await fetch(url.toString(), { headers: { Accept: "application/json" } });
            if (!response.ok) {
                throw new Error("category-totals-chart-failed");
            }
            categoryTotalsPayload = await response.json();
            card.classList.remove("loading");

            const levelLabel = categoryTotalsPayload.currentParentCategoryName
                ? i18n.categoryTotalsChartLevelChild.replace("{0}", categoryTotalsPayload.currentParentCategoryName)
                : i18n.categoryTotalsChartLevelRoot;
            const granularityLabel = categoryTotalsPayload.granularity === "MONTH"
                ? i18n.chartGranularityMonth
                : i18n.chartGranularityDay;
            meta.textContent = `${levelLabel} • ${i18n.chartMetaGranularity.replace("{0}", granularityLabel)}`;

            categoryTotalsDrillUpParentId = categoryTotalsPayload.drillUpParentCategoryId;
            if (drillUpButton) {
                drillUpButton.disabled = categoryTotalsPayload.currentParentCategoryId === null;
            }

            renderCategoryTotalsChart();
        } catch (error) {
            card.classList.remove("loading");
            meta.textContent = i18n.categoryTotalsChartLoadError;
            if (drillUpButton) {
                drillUpButton.disabled = true;
            }
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadSummary();
        loadInvestmentFlowEvolution();
        loadBalanceEvolution();
        loadRevenueExpenseEvolution();
        loadExpenseCategoryBreakdown();
        loadRevenueCategoryBreakdown();
        loadCategoryTotalsEvolution();

        const drillUpButton = document.getElementById("expense-category-drill-up");
        if (drillUpButton) {
            drillUpButton.addEventListener("click", () => {
                loadExpenseCategoryBreakdown(expenseCategoryDrillUpParentId);
            });
        }

        const categoryTotalsDrillUpButton = document.getElementById("category-totals-drill-up");
        if (categoryTotalsDrillUpButton) {
            categoryTotalsDrillUpButton.addEventListener("click", () => {
                loadCategoryTotalsEvolution(categoryTotalsDrillUpParentId);
            });
        }

        const revenueCategoryDrillUpButton = document.getElementById("revenue-category-drill-up");
        if (revenueCategoryDrillUpButton) {
            revenueCategoryDrillUpButton.addEventListener("click", () => {
                loadRevenueCategoryBreakdown(revenueCategoryDrillUpParentId);
            });
        }

        const selectorButtons = Array.from(document.querySelectorAll(".chart-mode-selector [data-mode]"));
        selectorButtons.forEach((button) => {
            button.addEventListener("click", () => {
                selectorButtons.forEach((candidate) => candidate.classList.remove("btn-active"));
                button.classList.add("btn-active");
                renderChart(button.dataset.mode);
            });
        });

        window.addEventListener("aisha-theme-changed", () => {
            const activeModeButton = document.querySelector(".chart-mode-selector .btn-active");
            const mode = activeModeButton?.dataset.mode ?? "accumulated";
            renderAccountTypeBalances(accountTypeBalancesPayload);
            renderInvestmentAllocationChart(
                "investment-allocation-type-chart",
                investmentAllocationTypePayload,
                i18n.investmentAllocationByTypeEmpty,
                "type",
                (item) => assetTypeLabel(item.key)
            );
            renderInvestmentFlowChart();
            renderChart(mode);
            renderRevenueExpenseChart();
            renderExpenseCategoryChart();
            renderRevenueCategoryChart();
            renderCategoryTotalsChart();
        });

        const accountTypeDrillUpButton = document.getElementById("account-type-balances-drill-up");
        if (accountTypeDrillUpButton) {
            accountTypeDrillUpButton.addEventListener("click", () => {
                accountTypeBalancesDrillDownType = null;
                renderAccountTypeBalances(accountTypeBalancesPayload);
            });
        }
    });
</script>
<footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>
</html>
