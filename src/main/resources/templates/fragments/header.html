<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="topbar(subtitle)" class="topbar">
    <script defer th:src="@{/vendor/lucide/lucide.min.js}"></script>
    <script defer th:src="@{/js/lucide-init.js}"></script>
    <script defer th:src="@{/js/selectable-table-rows.js}"></script>
    <script th:inline="javascript">
        (function () {
            const themeKey = "aisha-theme";
            const valuesVisibilityKey = "aisha-dashboard-values-hidden";
            const savedTheme = localStorage.getItem(themeKey);
            const savedValuesVisibility = localStorage.getItem(valuesVisibilityKey);
            const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            const theme = savedTheme === "dark" || savedTheme === "light"
                ? savedTheme
                : (prefersDark ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.setAttribute("data-values-hidden", String(savedValuesVisibility === "true"));
        }());
    </script>
    <div class="wrap brand">
        <div class="brand-main">
            <img class="brand-logo" th:src="@{/img/aisha-logo-simple.svg}" th:alt="#{app.logo.alt}">
            <div class="brand-text">
                <h1>AI$HA</h1>
                <p th:text="${subtitle}"></p>
                <nav class="topnav">
                    <a th:href="@{/dashboard}">
                        <i data-lucide="home" aria-hidden="true"></i>
                        <span th:text="#{nav.dashboard}"></span>
                    </a>
                    <a th:href="@{/entries}">
                        <i data-lucide="file-text" aria-hidden="true"></i>
                        <span th:text="#{nav.entries}"></span>
                    </a>
                    <a th:href="@{/categories}">
                        <i data-lucide="tag" aria-hidden="true"></i>
                        <span th:text="#{nav.categories}"></span>
                    </a>
                    <a th:href="@{/accounts}">
                        <i data-lucide="briefcase" aria-hidden="true"></i>
                        <span th:text="#{nav.accounts}"></span>
                    </a>
                    <a th:href="@{/investments}">
                        <i data-lucide="trending-up" aria-hidden="true"></i>
                        <span th:text="#{nav.investments}"></span>
                    </a>
                    <a th:href="@{/admin}">
                        <i data-lucide="shield-check" aria-hidden="true"></i>
                        <span th:text="#{nav.admin}"></span>
                    </a>
                </nav>
            </div>
        </div>
        <div class="topbar-user">
            <p class="topbar-user-greeting" th:if="${currentUsername != null}">
                <span th:text="#{auth.header.greeting}"></span>
                <strong th:text="${currentUsername}"></strong>
            </p>
            <div class="actions-inline topbar-controls">
                <button
                    type="button"
                    id="values-visibility-toggle"
                    class="btn btn-secondary btn-icon"
                    th:attr="aria-label=#{dashboard.values.toggle.hide},data-label-show=#{dashboard.values.toggle.show},data-label-hide=#{dashboard.values.toggle.hide}">
                    <span data-role="icon-visible">
                        <i data-lucide="eye" aria-hidden="true"></i>
                    </span>
                    <span data-role="icon-hidden" hidden>
                        <i data-lucide="eye-off" aria-hidden="true"></i>
                    </span>
                    <span class="sr-only" data-role="label" th:text="#{dashboard.values.toggle.hide}"></span>
                </button>
                <button
                    type="button"
                    id="theme-toggle"
                    class="btn btn-secondary btn-icon"
                    th:attr="aria-label=#{theme.toggle.aria},data-label-light=#{theme.toggle.light},data-label-dark=#{theme.toggle.dark}">
                    <span data-role="icon-dark">
                        <i data-lucide="moon" aria-hidden="true"></i>
                    </span>
                    <span data-role="icon-light" hidden>
                        <i data-lucide="sun" aria-hidden="true"></i>
                    </span>
                    <span class="sr-only" data-role="label"></span>
                </button>
                <form method="post" th:action="@{/logout}" th:if="${currentUsername != null}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-secondary">
                        <i data-lucide="log-out" aria-hidden="true"></i>
                        <span th:text="#{auth.header.logout}"></span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="wrap period-filter-wrap">
        <form class="period-filter" method="post" th:action="@{/date-filter}" id="period-filter-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="redirectTo" th:value="${currentPath}" id="period-filter-redirect-to">

            <div class="period-filter-row">
                <span class="period-filter-label" th:text="#{dateFilter.label}"></span>
                <div class="actions-inline period-filter-presets">
                    <button
                        class="btn btn-secondary"
                        type="submit"
                        name="action"
                        value="SET_WEEK"
                        th:classappend="${globalDateFilter != null and !globalDateFilter.custom and globalDateFilter.preset != null and globalDateFilter.preset.name() == 'WEEK'} ? ' btn-active' : ''">
                        <i data-lucide="calendar" aria-hidden="true"></i>
                        <span th:text="#{dateFilter.preset.week}"></span>
                    </button>
                    <button
                        class="btn btn-secondary"
                        type="submit"
                        name="action"
                        value="SET_MONTH"
                        th:classappend="${globalDateFilter != null and !globalDateFilter.custom and globalDateFilter.preset != null and globalDateFilter.preset.name() == 'MONTH'} ? ' btn-active' : ''">
                        <i data-lucide="calendar" aria-hidden="true"></i>
                        <span th:text="#{dateFilter.preset.month}"></span>
                    </button>
                    <button
                        class="btn btn-secondary"
                        type="submit"
                        name="action"
                        value="SET_YEAR"
                        th:classappend="${globalDateFilter != null and !globalDateFilter.custom and globalDateFilter.preset != null and globalDateFilter.preset.name() == 'YEAR'} ? ' btn-active' : ''">
                        <i data-lucide="calendar" aria-hidden="true"></i>
                        <span th:text="#{dateFilter.preset.year}"></span>
                    </button>
                </div>
            </div>

            <div class="period-filter-row period-filter-row-main">
                <div class="actions-inline period-filter-nav">
                    <button class="btn btn-secondary btn-icon" type="submit" name="action" value="GO_PREVIOUS">
                        <i data-lucide="chevron-left" aria-hidden="true"></i>
                        <span class="sr-only" th:text="#{dateFilter.nav.previous}"></span>
                    </button>
                    <button class="btn btn-secondary btn-icon" type="submit" name="action" value="GO_NEXT">
                        <i data-lucide="chevron-right" aria-hidden="true"></i>
                        <span class="sr-only" th:text="#{dateFilter.nav.next}"></span>
                    </button>
                </div>
                <div class="period-filter-inputs-wrap">
                    <div class="period-filter-inputs">
                        <label for="date-filter-start" th:text="#{dateFilter.field.start}"></label>
                        <input id="date-filter-start" type="date" name="startDate" th:value="${globalDateFilter != null ? globalDateFilter.startDate : null}">
                    </div>
                    <div class="period-filter-inputs">
                        <label for="date-filter-end" th:text="#{dateFilter.field.end}"></label>
                        <input id="date-filter-end" type="date" name="endDate" th:value="${globalDateFilter != null ? globalDateFilter.endDate : null}">
                    </div>
                </div>
                <button class="btn btn-primary period-filter-apply" type="submit" name="action" value="APPLY_CUSTOM">
                    <i data-lucide="check" aria-hidden="true"></i>
                    <span th:text="#{dateFilter.action.apply}"></span>
                </button>
            </div>
        </form>
    </div>
    <script>
        (function () {
            const themeKey = "aisha-theme";
            const valuesVisibilityKey = "aisha-dashboard-values-hidden";
            const valuesVisibilityToggle = document.getElementById("values-visibility-toggle");
            const themeToggle = document.getElementById("theme-toggle");
            const periodFilterForm = document.getElementById("period-filter-form");
            const periodFilterRedirectInput = document.getElementById("period-filter-redirect-to");

            if (valuesVisibilityToggle) {
                const valuesToggleLabel = valuesVisibilityToggle.querySelector('[data-role="label"]');
                const valuesIconVisible = valuesVisibilityToggle.querySelector('[data-role="icon-visible"]');
                const valuesIconHidden = valuesVisibilityToggle.querySelector('[data-role="icon-hidden"]');

                function valuesAreHidden() {
                    return document.documentElement.getAttribute("data-values-hidden") === "true";
                }

                function updateValuesVisibilityToggle() {
                    const hidden = valuesAreHidden();
                    const label = hidden
                        ? valuesVisibilityToggle.dataset.labelShow
                        : valuesVisibilityToggle.dataset.labelHide;

                    if (valuesToggleLabel) {
                        valuesToggleLabel.textContent = label;
                    }
                    if (valuesIconVisible && valuesIconHidden) {
                        valuesIconVisible.hidden = hidden;
                        valuesIconHidden.hidden = !hidden;
                    }
                    valuesVisibilityToggle.setAttribute("aria-label", label);
                    valuesVisibilityToggle.setAttribute("aria-pressed", String(hidden));
                }

                valuesVisibilityToggle.addEventListener("click", () => {
                    const nextHidden = !valuesAreHidden();
                    document.documentElement.setAttribute("data-values-hidden", String(nextHidden));
                    localStorage.setItem(valuesVisibilityKey, String(nextHidden));
                    updateValuesVisibilityToggle();
                });

                updateValuesVisibilityToggle();
            }

            if (themeToggle) {
                const themeToggleLabel = themeToggle.querySelector('[data-role="label"]');
                const themeIconDark = themeToggle.querySelector('[data-role="icon-dark"]');
                const themeIconLight = themeToggle.querySelector('[data-role="icon-light"]');

                function readCurrentTheme() {
                    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
                }

                function updateToggleLabel() {
                    const currentTheme = readCurrentTheme();
                    const nextTheme = currentTheme === "dark" ? "light" : "dark";
                    const label = nextTheme === "dark"
                        ? themeToggle.dataset.labelDark
                        : themeToggle.dataset.labelLight;

                    if (themeToggleLabel) {
                        themeToggleLabel.textContent = label;
                    }
                    if (themeIconDark && themeIconLight) {
                        themeIconDark.hidden = nextTheme !== "dark";
                        themeIconLight.hidden = nextTheme !== "light";
                    }
                    themeToggle.setAttribute("aria-pressed", String(currentTheme === "dark"));
                }

                themeToggle.addEventListener("click", () => {
                    const currentTheme = readCurrentTheme();
                    const nextTheme = currentTheme === "dark" ? "light" : "dark";
                    document.documentElement.setAttribute("data-theme", nextTheme);
                    localStorage.setItem(themeKey, nextTheme);
                    window.dispatchEvent(new CustomEvent("aisha-theme-changed", { detail: { theme: nextTheme } }));
                    updateToggleLabel();
                });

                updateToggleLabel();
            }

            if (periodFilterForm && periodFilterRedirectInput) {
                periodFilterForm.addEventListener("submit", () => {
                    periodFilterRedirectInput.value = `${window.location.pathname}${window.location.search}`;
                });
            }

        }());
    </script>
</header>
</body>
</html>
