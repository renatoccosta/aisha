<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="appFooter" class="app-footer">
    <div class="wrap app-footer-content">
        <section class="app-footer-block">
            <p class="app-footer-tagline" th:text="#{footer.tagline}"></p>
            <p class="app-footer-rights" th:text="#{footer.rights(${#dates.format(#dates.createNow(), 'yyyy')})}"></p>
            <p class="app-footer-version">
                <i data-lucide="git-commit-horizontal" aria-hidden="true"></i>
                <span th:text="#{footer.version(${applicationVersion})}"></span>
            </p>
        </section>

        <section class="app-footer-block">
            <h2 class="app-footer-title" th:text="#{footer.links.title}"></h2>
            <nav class="app-footer-links" th:attr="aria-label=#{footer.links.aria}">
                <a th:href="@{/terms-of-use}">
                    <i data-lucide="file-text" aria-hidden="true"></i>
                    <span th:text="#{footer.link.termsOfUse}"></span>
                </a>
                <a th:href="@{/privacy-policy}">
                    <i data-lucide="file-lock-2" aria-hidden="true"></i>
                    <span th:text="#{footer.link.privacyPolicy}"></span>
                </a>
            </nav>
        </section>

        <section class="app-footer-block">
            <h2 class="app-footer-title" th:text="#{footer.projectLinks.title}"></h2>
            <ul class="app-footer-info-list">
                <li>
                    <a href="https://github.com/renatoccosta/aisha" target="_blank" rel="noopener noreferrer">
                        <i data-lucide="github" aria-hidden="true"></i>
                        <span th:text="#{footer.link.github}"></span>
                    </a>
                </li>
            </ul>
        </section>
    </div>
</footer>
</body>
</html>
