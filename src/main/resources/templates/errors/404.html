<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{errors.notFound.title}"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/aisha-logo-simple.svg}">
    <script th:inline="javascript">
        (function () {
            const key = "aisha-theme";
            const savedTheme = localStorage.getItem(key);
            const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            const theme = savedTheme === "dark" || savedTheme === "light"
                ? savedTheme
                : (prefersDark ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        }());
    </script>
</head>
<body>
<main class="wrap auth-main error-main">
    <section class="card form-card auth-card error-card">
        <h1 th:text="#{errors.notFound.title}"></h1>
        <p th:text="#{errors.notFound.message}"></p>
        <a class="btn btn-primary error-actions" th:href="@{/dashboard}" onclick="if (window.history.length > 1) { window.history.back(); return false; }">
            <i data-lucide="arrow-left" aria-hidden="true"></i>
            <span th:text="#{errors.notFound.back}"></span>
        </a>
    </section>
</main>
<script defer th:src="@{/vendor/lucide/lucide.min.js}"></script>
<script defer th:src="@{/js/lucide-init.js}"></script>
<footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>
</html>
