<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{categories.list.title}"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/aisha-logo-simple.svg}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<header th:replace="~{fragments/header :: topbar(subtitle=#{categories.list.header.subtitle})}"></header>

<main class="wrap">
    <section class="card header-actions">
        <div>
            <h2 th:text="#{categories.list.heading}"></h2>
            <p th:text="#{categories.list.subtitle}"></p>
        </div>
        <a class="btn btn-primary" th:href="@{/categories/new(returnTo=${returnTo})}">
            <i data-lucide="plus" aria-hidden="true"></i>
            <span th:text="#{categories.list.action.new}"></span>
        </a>
    </section>

    <section id="table-container" th:fragment="table" class="card">
        <p class="error" th:if="${hasError}" th:text="#{categories.error.inUse}"></p>

        <div class="pagination-bar" th:if="${pagination != null}">
            <div class="pagination-controls">
                <form
                    class="pagination-size-form"
                    method="get"
                    th:action="@{/categories}"
                    hx-get="/categories/fragments/table"
                    hx-target="#table-container"
                    hx-swap="outerHTML">
                    <input type="hidden" name="page" value="0">
                    <label for="categories-page-size" th:text="#{pagination.size.label}"></label>
                    <select id="categories-page-size" name="size" onchange="this.form.requestSubmit()">
                        <option
                            th:each="allowedSize : ${allowedPageSizes}"
                            th:value="${allowedSize}"
                            th:selected="${allowedSize == pagination.pageSize}"
                            th:text="${allowedSize}">
                        </option>
                    </select>
                </form>

                <form
                    class="pagination-nav-form"
                    method="get"
                    th:action="@{/categories}"
                    hx-get="/categories/fragments/table"
                    hx-target="#table-container"
                    hx-swap="outerHTML">
                    <input type="hidden" name="size" th:value="${pagination.pageSize}">
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.firstPage()}" th:disabled="${!pagination.hasPrevious()}">
                        <i data-lucide="chevrons-left" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.first}"></span>
                    </button>
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.previousPage()}" th:disabled="${!pagination.hasPrevious()}">
                        <i data-lucide="chevron-left" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.previous}"></span>
                    </button>
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.nextPage()}" th:disabled="${!pagination.hasNext()}">
                        <i data-lucide="chevron-right" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.next}"></span>
                    </button>
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.lastPage()}" th:disabled="${!pagination.hasNext()}">
                        <i data-lucide="chevrons-right" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.last}"></span>
                    </button>
                </form>
            </div>
            <div class="pagination-summary">
                <span th:text="#{pagination.summary.page(${pagination.currentPageDisplay()}, ${pagination.totalPages})}"></span>
                <span th:text="#{pagination.summary.range(${pagination.rangeStart}, ${pagination.rangeEnd}, ${pagination.totalItems})}"></span>
            </div>
        </div>

        <div data-selection-scope>
            <div id="categories-bulk-delete-state">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="page" th:value="${pagination != null ? pagination.page : 0}">
            <input type="hidden" name="size" th:value="${pagination != null ? pagination.pageSize : 25}">
            </div>

            <div class="table-actions">
                <span
                    class="selection-counter"
                    aria-live="polite">
                    <i data-lucide="list-checks" aria-hidden="true"></i>
                    <span
                        data-selected-count-display
                        th:attr="data-label-singular=#{selection.counter.template.singular},data-label-plural=#{selection.counter.template.plural}"
                        th:text="#{selection.counter.plural(0)}">
                        0 registros selecionados
                    </span>
                </span>
                <button
                    class="btn btn-danger"
                    type="button"
                    hx-post="/categories/bulk-delete"
                    hx-target="#table-container"
                    hx-swap="outerHTML"
                    hx-include="#categories-bulk-delete-state input, #categories-table input[name='ids']:checked"
                    th:attr="hx-confirm=#{categories.list.confirm.bulkDelete}">
                    <i data-lucide="trash-2" aria-hidden="true"></i>
                    <span th:text="#{categories.list.action.bulkDelete}"></span>
                </button>
            </div>

            <div class="table-wrap">
                <table id="categories-table" class="responsive-list">
                    <thead>
                    <tr>
                        <th>
                            <button
                                class="table-select-all-toggle"
                                type="button"
                                th:attr="data-label-none=#{selection.toggle.none},data-label-some=#{selection.toggle.some},data-label-all=#{selection.toggle.all}">
                                <span class="table-heading-label" aria-hidden="true">
                                    <span data-state-icon="none">
                                        <i data-lucide="square" aria-hidden="true"></i>
                                    </span>
                                    <span data-state-icon="some" hidden>
                                        <i data-lucide="minus-square" aria-hidden="true"></i>
                                    </span>
                                    <span data-state-icon="all" hidden>
                                        <i data-lucide="check-square" aria-hidden="true"></i>
                                    </span>
                                </span>
                                <span class="sr-only" th:text="#{categories.list.table.select}"></span>
                            </button>
                        </th>
                        <th><span class="table-heading-label"><i data-lucide="tag" aria-hidden="true"></i><span th:text="#{categories.list.table.title}"></span></span></th>
                        <th><span class="table-heading-label"><i data-lucide="file-text" aria-hidden="true"></i><span th:text="#{categories.list.table.description}"></span></span></th>
                        <th><span class="table-heading-label"><i data-lucide="git-branch" aria-hidden="true"></i><span th:text="#{categories.list.table.parent}"></span></span></th>
                        <th><span class="table-heading-label"><i data-lucide="settings" aria-hidden="true"></i><span th:text="#{categories.list.table.actions}"></span></span></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(categories)}" class="empty-row">
                        <td colspan="5" class="empty" th:text="#{categories.list.empty}"></td>
                    </tr>
                    <tr th:each="category : ${categories}">
                        <td class="cell-select" th:attr="data-label=#{categories.list.table.select}">
                            <input type="checkbox" name="ids" th:value="${category.id}" th:attr="aria-label=#{categories.list.table.selectItem}">
                        </td>
                        <td th:attr="data-label=#{categories.list.table.title}" th:text="${category.title}"></td>
                        <td th:attr="data-label=#{categories.list.table.description}" th:text="${category.description}"></td>
                        <td th:attr="data-label=#{categories.list.table.parent}" th:text="${category.parent != null ? category.parent.title : '-'}"></td>
                        <td class="cell-actions" th:attr="data-label=#{categories.list.table.actions}">
                            <div class="actions-inline">
                                <a class="btn btn-secondary" th:href="@{/categories/{id}/edit(id=${category.id},returnTo=${returnTo})}">
                                    <i data-lucide="edit-3" aria-hidden="true"></i>
                                    <span th:text="#{categories.list.action.edit}"></span>
                                </a>
                                <button
                                    class="btn btn-danger"
                                    type="button"
                                    th:attr="hx-post=@{/categories/{id}/delete(id=${category.id},page=${pagination != null ? pagination.page : 0},size=${pagination != null ? pagination.pageSize : 25})},hx-confirm=#{categories.list.confirm.delete}"
                                    hx-target="#table-container"
                                    hx-swap="outerHTML"
                                    hx-include="#categories-bulk-delete-state input">
                                    <i data-lucide="trash-2" aria-hidden="true"></i>
                                    <span th:text="#{categories.list.action.delete}"></span>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </section>

    <section class="card balances-block" th:if="${categoryBalanceReport != null}">
        <h3 th:text="#{categories.balance.heading}"></h3>
        <p
            th:text="#{categories.balance.subtitle(${#temporals.format(categoryBalanceReport.startDate, 'dd/MM/yyyy')}, ${#temporals.format(categoryBalanceReport.endDate, 'dd/MM/yyyy')})}">
        </p>

        <div class="table-wrap">
            <table class="balances-table">
                <thead>
                <tr>
                    <th>
                        <span class="table-heading-label">
                            <i data-lucide="tag" aria-hidden="true"></i>
                            <span th:text="#{categories.balance.table.category}"></span>
                        </span>
                    </th>
                    <th class="amount-cell" th:each="bucket : ${categoryBalanceReport.buckets}">
                        <span class="table-heading-label">
                            <i data-lucide="calendar" aria-hidden="true"></i>
                            <span th:switch="${categoryBalanceReport.granularity.name()}">
                            <span th:case="'YEAR'" th:text="${#temporals.format(bucket.startDate, 'yyyy')}"></span>
                            <span th:case="'MONTH'" th:text="${#temporals.format(bucket.startDate, 'MMM')}"></span>
                            <span th:case="'DAY'" th:text="${#temporals.format(bucket.startDate, 'd')}"></span>
                            <span th:case="*" th:text="${#temporals.format(bucket.startDate, 'd')}"></span>
                            </span>
                        </span>
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(categoryBalanceReport.rows)}">
                    <td class="empty" th:colspan="${1 + #lists.size(categoryBalanceReport.buckets)}" th:text="#{categories.balance.empty}"></td>
                </tr>
                <tr th:each="row : ${categoryBalanceReport.rows}">
                    <td>
                        <strong th:text="${row.categoryTitle}"></strong>
                    </td>
                    <td class="amount-cell" th:each="periodBalance : ${row.periodBalances}" th:text="${#numbers.formatDecimal(periodBalance, 1, 'POINT', 2, 'COMMA')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>
</html>
