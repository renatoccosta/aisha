<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${mode == 'create'} ? #{accounts.form.title.create} : #{accounts.form.title.edit}"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/aisha-logo-simple.svg}">
</head>
<body>
<header th:replace="~{fragments/header :: topbar(subtitle=#{accounts.form.header.subtitle})}"></header>

<main class="wrap">
    <section class="card form-card">
        <h2 th:text="${mode == 'create'} ? #{accounts.form.title.create} : #{accounts.form.title.edit}"></h2>

        <form class="stack-form" th:object="${form}" th:action="${mode == 'create'} ? @{/accounts} : @{/accounts/{id}(id=${accountId})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="returnTo" th:value="${returnTo}">
            <div class="field">
                <label for="title" th:text="#{accounts.form.field.title.required}"></label>
                <input id="title" type="text" th:field="*{title}" maxlength="120" required>
                <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
            </div>

            <div class="field">
                <label for="description" th:text="#{accounts.form.field.description}"></label>
                <textarea id="description" th:field="*{description}" rows="4" maxlength="300"></textarea>
                <p class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label for="initialBalance" th:text="#{accounts.form.field.initialBalance.required}"></label>
                    <input id="initialBalance" type="number" th:field="*{initialBalance}" step="0.01" required>
                    <p class="error" th:if="${#fields.hasErrors('initialBalance')}" th:errors="*{initialBalance}"></p>
                </div>

                <div class="field">
                    <label for="initialBalanceDate" th:text="#{accounts.form.field.initialBalanceDate.required}"></label>
                    <input id="initialBalanceDate" type="date" th:field="*{initialBalanceDate}" required>
                    <p class="error" th:if="${#fields.hasErrors('initialBalanceDate')}" th:errors="*{initialBalanceDate}"></p>
                </div>
            </div>

            <div class="field">
                <label for="deactivationDate" th:text="#{accounts.form.field.deactivationDate}"></label>
                <input id="deactivationDate" type="date" th:field="*{deactivationDate}">
                <p class="error" th:if="${#fields.hasErrors('deactivationDate')}" th:errors="*{deactivationDate}"></p>
            </div>

            <div class="actions-inline">
                <button class="btn btn-primary" type="submit">
                    <i data-lucide="save" aria-hidden="true"></i>
                    <span th:text="${mode == 'create'} ? #{accounts.form.action.save} : #{accounts.form.action.update}"></span>
                </button>
                <a class="btn btn-secondary" th:href="${returnTo}">
                    <i data-lucide="arrow-left" aria-hidden="true"></i>
                    <span th:text="#{accounts.form.action.cancel}"></span>
                </a>
            </div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>
</html>
