<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{accounts.list.title}"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/aisha-logo-simple.svg}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<header th:replace="~{fragments/header :: topbar(subtitle=#{accounts.list.header.subtitle})}"></header>

<main class="wrap">
    <section class="card header-actions">
        <div>
            <h2 th:text="#{accounts.list.heading}"></h2>
            <p th:text="#{accounts.list.subtitle}"></p>
        </div>
        <a class="btn btn-primary" th:href="@{/accounts/new(returnTo=${returnTo})}">
            <i data-lucide="plus" aria-hidden="true"></i>
            <span th:text="#{accounts.list.action.new}"></span>
        </a>
    </section>

    <section id="table-container" th:fragment="table" class="card">
        <p class="error" th:if="${hasError}" th:text="#{accounts.error.inUse}"></p>

        <div class="pagination-bar" th:if="${pagination != null}">
            <div class="pagination-controls">
                <form
                    class="pagination-size-form"
                    method="get"
                    th:action="@{/accounts}"
                    hx-get="/accounts/fragments/table"
                    hx-target="#table-container"
                    hx-swap="outerHTML">
                    <input type="hidden" name="page" value="0">
                    <label for="accounts-page-size" th:text="#{pagination.size.label}"></label>
                    <select id="accounts-page-size" name="size" onchange="this.form.requestSubmit()">
                        <option
                            th:each="allowedSize : ${allowedPageSizes}"
                            th:value="${allowedSize}"
                            th:selected="${allowedSize == pagination.pageSize}"
                            th:text="${allowedSize}">
                        </option>
                    </select>
                </form>

                <form
                    class="pagination-nav-form"
                    method="get"
                    th:action="@{/accounts}"
                    hx-get="/accounts/fragments/table"
                    hx-target="#table-container"
                    hx-swap="outerHTML">
                    <input type="hidden" name="size" th:value="${pagination.pageSize}">
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.firstPage()}" th:disabled="${!pagination.hasPrevious()}">
                        <i data-lucide="chevrons-left" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.first}"></span>
                    </button>
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.previousPage()}" th:disabled="${!pagination.hasPrevious()}">
                        <i data-lucide="chevron-left" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.previous}"></span>
                    </button>
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.nextPage()}" th:disabled="${!pagination.hasNext()}">
                        <i data-lucide="chevron-right" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.next}"></span>
                    </button>
                    <button class="btn btn-secondary" type="submit" name="page" th:value="${pagination.lastPage()}" th:disabled="${!pagination.hasNext()}">
                        <i data-lucide="chevrons-right" aria-hidden="true"></i>
                        <span th:text="#{pagination.nav.last}"></span>
                    </button>
                </form>
            </div>
            <div class="pagination-summary">
                <span th:text="#{pagination.summary.page(${pagination.currentPageDisplay()}, ${pagination.totalPages})}"></span>
                <span th:text="#{pagination.summary.range(${pagination.rangeStart}, ${pagination.rangeEnd}, ${pagination.totalItems})}"></span>
            </div>
        </div>

        <div data-selection-scope>
            <div id="accounts-bulk-delete-state">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="page" th:value="${pagination != null ? pagination.page : 0}">
            <input type="hidden" name="size" th:value="${pagination != null ? pagination.pageSize : 25}">
            </div>

            <div class="table-actions">
                <span
                    class="selection-counter"
                    aria-live="polite">
                    <i data-lucide="list-checks" aria-hidden="true"></i>
                    <span
                        data-selected-count-display
                        th:attr="data-label-singular=#{selection.counter.template.singular},data-label-plural=#{selection.counter.template.plural}"
                        th:text="#{selection.counter.plural(0)}">
                        0 registros selecionados
                    </span>
                </span>
                <button
                    class="btn btn-danger"
                    type="button"
                    hx-post="/accounts/bulk-delete"
                    hx-target="#table-container"
                    hx-swap="outerHTML"
                    hx-include="#accounts-bulk-delete-state input, #accounts-table input[name='ids']:checked"
                    th:attr="hx-confirm=#{accounts.list.confirm.bulkDelete}">
                    <i data-lucide="trash-2" aria-hidden="true"></i>
                    <span th:text="#{accounts.list.action.bulkDelete}"></span>
                </button>
            </div>

            <div class="table-wrap">
                <table id="accounts-table" class="responsive-list">
                    <thead>
                    <tr>
                        <th>
                            <button
                                class="table-select-all-toggle"
                                type="button"
                                th:attr="data-label-none=#{selection.toggle.none},data-label-some=#{selection.toggle.some},data-label-all=#{selection.toggle.all}">
                                <span class="table-heading-label" aria-hidden="true">
                                    <span data-state-icon="none">
                                        <i data-lucide="square" aria-hidden="true"></i>
                                    </span>
                                    <span data-state-icon="some" hidden>
                                        <i data-lucide="minus-square" aria-hidden="true"></i>
                                    </span>
                                    <span data-state-icon="all" hidden>
                                        <i data-lucide="check-square" aria-hidden="true"></i>
                                    </span>
                                </span>
                                <span class="sr-only" th:text="#{accounts.list.table.select}"></span>
                            </button>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="briefcase" aria-hidden="true"></i>
                                <span th:text="#{accounts.list.table.title}"></span>
                            </span>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="file-text" aria-hidden="true"></i>
                                <span th:text="#{accounts.list.table.description}"></span>
                            </span>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="badge-check" aria-hidden="true"></i>
                                <span th:text="#{accounts.list.table.accountType}"></span>
                            </span>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="calendar-x-2" aria-hidden="true"></i>
                                <span th:text="#{accounts.list.table.deactivationDate}"></span>
                            </span>
                        </th>
                        <th>
                            <span class="table-heading-label">
                                <i data-lucide="settings" aria-hidden="true"></i>
                                <span th:text="#{accounts.list.table.actions}"></span>
                            </span>
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(accounts)}" class="empty-row">
                        <td colspan="6" class="empty" th:text="#{accounts.list.empty}"></td>
                    </tr>
                    <tr th:each="account : ${accounts}">
                        <td class="cell-select" th:attr="data-label=#{accounts.list.table.select}">
                            <input type="checkbox" name="ids" th:value="${account.id}" th:attr="aria-label=#{accounts.list.table.selectItem}">
                        </td>
                        <td th:attr="data-label=#{accounts.list.table.title}" th:text="${account.title}"></td>
                        <td th:attr="data-label=#{accounts.list.table.description}" th:text="${account.description}"></td>
                        <td th:attr="data-label=#{accounts.list.table.accountType}" th:text="#{${'account.type.' + (account.accountType != null ? account.accountType.name().toLowerCase() : 'other')}}"></td>
                        <td
                            th:attr="data-label=#{accounts.list.table.deactivationDate}"
                            th:text="${account.deactivationDate != null ? #temporals.format(account.deactivationDate, 'dd/MM/yyyy') : '-'}">
                        </td>
                        <td class="cell-actions" th:attr="data-label=#{accounts.list.table.actions}">
                            <div class="actions-inline">
                                <a class="btn btn-secondary" th:href="@{/accounts/{id}/edit(id=${account.id},returnTo=${returnTo})}">
                                    <i data-lucide="edit-3" aria-hidden="true"></i>
                                    <span th:text="#{accounts.list.action.edit}"></span>
                                </a>
                                <button
                                    class="btn btn-danger"
                                    type="button"
                                    th:attr="hx-post=@{/accounts/{id}/delete(id=${account.id},page=${pagination != null ? pagination.page : 0},size=${pagination != null ? pagination.pageSize : 25})},hx-confirm=#{accounts.list.confirm.delete}"
                                    hx-target="#table-container"
                                    hx-swap="outerHTML"
                                    hx-include="#accounts-bulk-delete-state input">
                                    <i data-lucide="trash-2" aria-hidden="true"></i>
                                    <span th:text="#{accounts.list.action.delete}"></span>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </section>

    <section class="card balances-block" th:if="${accountBalanceReport != null}">
        <h3 th:text="#{accounts.balance.heading}"></h3>
        <p
            th:text="#{accounts.balance.subtitle(${#temporals.format(accountBalanceReport.startDate, 'dd/MM/yyyy')}, ${#temporals.format(accountBalanceReport.endDate, 'dd/MM/yyyy')})}">
        </p>

        <div class="table-wrap">
            <table class="balances-table">
                <thead>
                <tr>
                    <th>
                        <span class="table-heading-label">
                            <i data-lucide="briefcase" aria-hidden="true"></i>
                            <span th:text="#{accounts.balance.table.account}"></span>
                        </span>
                    </th>
                    <th class="amount-cell">
                        <span class="table-heading-label">
                            <i data-lucide="rotate-ccw" aria-hidden="true"></i>
                            <span th:text="#{accounts.balance.table.previousPeriod}"></span>
                        </span>
                    </th>
                    <th class="amount-cell" th:each="bucket : ${accountBalanceReport.buckets}">
                        <span class="table-heading-label">
                            <i data-lucide="calendar" aria-hidden="true"></i>
                            <span th:switch="${accountBalanceReport.granularity.name()}">
                            <span th:case="'YEAR'" th:text="${#temporals.format(bucket.startDate, 'yyyy')}"></span>
                            <span th:case="'MONTH'" th:text="${#temporals.format(bucket.startDate, 'MMM')}"></span>
                            <span th:case="'DAY'" th:text="${#temporals.format(bucket.startDate, 'd')}"></span>
                            <span th:case="*" th:text="${#temporals.format(bucket.startDate, 'd')}"></span>
                            </span>
                        </span>
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(accountBalanceReport.rows)}">
                    <td class="empty" th:colspan="${2 + #lists.size(accountBalanceReport.buckets)}" th:text="#{accounts.balance.empty}"></td>
                </tr>
                <tr th:each="row : ${accountBalanceReport.rows}">
                    <td>
                        <strong th:text="${row.accountTitle}"></strong>
                    </td>
                    <td
                        class="amount-cell"
                        th:text="${row.previousPeriodBalance != null ? #numbers.formatDecimal(row.previousPeriodBalance, 1, 'POINT', 2, 'COMMA') : '-'}">
                    </td>
                    <td
                        class="amount-cell"
                        th:each="periodBalance : ${row.periodBalances}"
                        th:text="${periodBalance != null ? #numbers.formatDecimal(periodBalance, 1, 'POINT', 2, 'COMMA') : '-'}">
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>
</html>
