services:
  postgres:
    image: postgres:17-alpine
    container_name: aisha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aisha
      POSTGRES_USER: aisha
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisha -d aisha"]
      interval: 10s
      timeout: 5s
      retries: 5

  aisha:
    image: ghcr.io/renatoccosta/aisha:latest
    container_name: aisha-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Overridable defaults from Dockerfile
      TZ: America/Sao_Paulo
      JAVA_OPTS: -XX:InitialRAMPercentage=25.0 -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8
      SPRING_PROFILES_ACTIVE: postgres,prod
      DB_URL: jdbc:postgresql://postgres:5432/aisha
      DB_USERNAME: aisha
      DB_PASSWORD: change-me
      AISHA_SECURITY_SEED_USERNAME: admin
      AISHA_SECURITY_SEED_PASSWORD: change-this-password

volumes:
  postgres_data:
