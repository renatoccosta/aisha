name: Release Snapshot Docker Image (GHCR)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch de origem para snapshot (ex.: feature/minha-feature)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  snapshot-release:
    name: Tag and Publish Snapshot Image
    runs-on: ubuntu-latest
    concurrency:
      group: snapshot-release-${{ github.event.inputs.source_branch }}
      cancel-in-progress: false

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.source_branch }}

      - name: Resolve snapshot version and tag
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags --force

          latest_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi

          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$version"

          next_minor_version="${major}.$((minor + 1)).0"

          raw_branch='${{ github.event.inputs.source_branch }}'
          branch_for_tag="$(echo "$raw_branch" | sed 's#^refs/heads/##')"
          safe_branch="$(echo "$branch_for_tag" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g; s#-\{2,\}#-#g; s#^-##; s#-$##')"
          if [ -z "$safe_branch" ]; then
            echo "Invalid source_branch after sanitization."
            exit 1
          fi

          short_sha="$(git rev-parse --short HEAD)"
          snapshot_tag="${next_minor_version}-snapshot.${safe_branch}.${short_sha}"
          snapshot_image_tag="$snapshot_tag"

          if git rev-parse "$snapshot_tag" >/dev/null 2>&1; then
            echo "Tag $snapshot_tag already exists."
            exit 1
          fi

          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "next_minor_version=$next_minor_version" >> "$GITHUB_OUTPUT"
          echo "safe_branch=$safe_branch" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "snapshot_tag=$snapshot_tag" >> "$GITHUB_OUTPUT"
          echo "snapshot_image_tag=$snapshot_image_tag" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: ./mvnw -Drevision=${{ steps.snapshot.outputs.snapshot_tag }} test

      - name: Build application JAR
        run: ./mvnw -Drevision=${{ steps.snapshot.outputs.snapshot_tag }} -DskipTests package

      - name: Prepare snapshot artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail

          original_jar="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.jar.original' | head -n 1)"
          if [ -z "$original_jar" ]; then
            echo "No JAR artifact found in target/."
            exit 1
          fi

          release_jar="$(basename "$original_jar")"

          echo "release_jar=$release_jar" >> "$GITHUB_OUTPUT"
          echo "release_jar_path=$original_jar" >> "$GITHUB_OUTPUT"

      - name: Create and push snapshot tag
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git tag '${{ steps.snapshot.outputs.snapshot_tag }}'
          git push origin '${{ steps.snapshot.outputs.snapshot_tag }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push snapshot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            REVISION=${{ steps.snapshot.outputs.snapshot_tag }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.snapshot.outputs.snapshot_image_tag }}

      - name: Create GitHub Snapshot Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.snapshot.outputs.snapshot_tag }}
          name: Snapshot ${{ steps.snapshot.outputs.snapshot_tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ steps.artifact.outputs.release_jar_path }}

      - name: Release summary
        run: |
          {
            echo "### Snapshot release created"
            echo ""
            echo "- Source branch: \`${{ github.event.inputs.source_branch }}\`"
            echo "- Latest stable tag (main base): \`${{ steps.snapshot.outputs.latest_tag }}\`"
            echo "- Next minor version: \`${{ steps.snapshot.outputs.next_minor_version }}\`"
            echo "- Snapshot git tag: \`${{ steps.snapshot.outputs.snapshot_tag }}\`"
            echo "- GHCR image tag: \`ghcr.io/${{ github.repository }}:${{ steps.snapshot.outputs.snapshot_image_tag }}\`"
            echo "- JAR artifact: \`${{ steps.artifact.outputs.release_jar }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
